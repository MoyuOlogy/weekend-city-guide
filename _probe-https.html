<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>https-origin probe</title></head>
<body>
<pre id="OUT">running…</pre>
<script>
(async function(){
  const L = [];
  const log = s => { L.push(String(s)); document.querySelector('#OUT').textContent = L.join('\n'); };
  try{
    log('origin=' + location.origin);
    const key = 'wcg-httpscheck';
    const url = 'https://textdb.dev/api/data/' + key;
    const body = JSON.stringify({ v:2, room:'HTTPS1', nick:'线上Origin测试', ts:Date.now(),
      teams:[{ id:'h1', owner:'线上Origin测试', title:'从 GitHub Pages 写入', cap:3, budget:0, members:['线上Origin测试'], ts:Date.now() }] });
    const w = await fetch(url, { method:'POST', body, headers:{ 'Content-Type':'application/json' } });
    log('POST(write) status=' + w.status);
    const r = await fetch(url + '?_=' + Date.now());
    const txt = (await r.text()).trim();
    log('GET(read) status=' + r.status + ' len=' + txt.length);
    let data = JSON.parse(txt); if(typeof data === 'string') data = JSON.parse(data);
    log('解析成功 teams=' + JSON.stringify((data.teams || []).map(t => t.title)));
    log('中文完好=' + (txt.includes('从 GitHub Pages 写入') ? 'YES' : 'NO'));
    log('结论=' + (w.status === 200 && r.status === 200 && data.teams && data.teams.length === 1 ? 'PASS 线上Origin读写正常' : 'FAIL'));
  }catch(e){ log('EXCEPTION ' + e.name + ': ' + e.message); log('结论=FAIL'); }
  document.title = 'probe done';
})();
</script>
</body></html>
