<pre id="TESTOUT" style="display:none"></pre>
<script>
(async function(){
  const R = [];
  const ok = (n, c) => R.push((c ? 'PASS' : 'FAIL') + ' :: ' + n);
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  /* 注入「关闭过渡」样式：无头虚拟时钟不推进 transition，否则量到的几何/状态都是起始值 */
  try{
    const s = document.createElement('style');
    s.textContent = '*,*::before,*::after{transition:none !important;animation:none !important}';
    document.head.appendChild(s);
  }catch(e){}

  async function waitFor(fn, tries = 40){ for(let i = 0; i < tries; i++){ if(fn()) return true; await sleep(150); } return false; }

  // 真实点击序列（pointerdown → mousedown → pointerup → mouseup → click），和真人鼠标一致
  const fire = (el, type) => el.dispatchEvent(new MouseEvent(type, { bubbles:true, cancelable:true, view:window }));
  const firePtr = (el, type) => el.dispatchEvent(new PointerEvent(type, { bubbles:true, cancelable:true }));
  const realClick = el => { firePtr(el,'pointerdown'); fire(el,'mousedown'); firePtr(el,'pointerup'); fire(el,'mouseup'); fire(el,'click'); };

  const openSheets = () => [...document.querySelectorAll('.sheet')].filter(s => s.classList.contains('on')).map(s => s.id);
  const pagesShown = () => [...document.querySelectorAll('main')].filter(m => !m.hidden).map(m => m.id);
  const snap = () => JSON.stringify({
    hash: location.hash, sheets: openSheets(), pages: pagesShown(),
    theme: document.documentElement.dataset.theme,
    store: [store.teams.length, store.checkins.length, store.guides.length, store.activities.length,
            Object.keys(store.likes).length],
    form: (document.querySelector('#sheetForm') || {}).innerHTML ? document.querySelector('#sheetForm').innerHTML.length : 0,
    toast: document.querySelector('#toast').textContent,
    aboutTab: (document.querySelector('#aboutTabs .atab.on') || { dataset:{} }).dataset.atab || '',
    tour: (document.querySelector('#tour') && !document.querySelector('#tour').hidden)
            ? document.querySelector('#tourStepNo').textContent : ''
  });
  const clearAll = () => {
    document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
    document.querySelector('#mask').classList.remove('on');
    if(tourOn) endTour(false);          // 审计里点到「开始引导」时要能收场
  };

  try{
    await waitFor(() => document.querySelectorAll('#feed .note').length > 0);

    /* ================= A0. 首次访问的强制新手引导 =================
       本套件每次都用全新 profile，等价于「第一次访问」，所以引导会真的弹出来。
       先断言它，再关掉 —— 遮罩会挡住后面的点击审计。 */
    const tourBox = document.querySelector('#tour');
    ok('★ 首次访问自动弹出新手引导', !!tourBox && !tourBox.hidden);
    ok('引导遮罩是覆盖全屏的模态层（position:fixed 且盖过弹窗层）',
       getComputedStyle(tourBox).position === 'fixed' && +getComputedStyle(tourBox).zIndex > 80);
    ok('引导第一步：高亮框隐藏、「上一步」禁用', document.querySelector('#tourHole').hidden === true &&
        document.querySelector('#tourPrev').disabled === true);
    realClick(document.querySelector('#tourNext')); await sleep(250);
    ok('★ 点「下一步」走到第 2 步，并高亮首页天气条', (() => {
      const hole = document.querySelector('#tourHole');
      if(document.querySelector('#tourStepNo').textContent !== '第 2 / ' + TOUR.length + ' 步') return false;
      if(hole.hidden || document.querySelector('#page-feed').hidden) return false;
      const r = document.querySelector('#weatherBar').getBoundingClientRect();
      const h = hole.getBoundingClientRect();
      return Math.abs(h.left - (r.left - 6)) < 3 && Math.abs(h.top - (r.top - 6)) < 3;
    })());
    realClick(document.querySelector('#tourPrev')); await sleep(250);
    ok('★「上一步」能退回第 1 步', document.querySelector('#tourStepNo').textContent === '第 1 / ' + TOUR.length + ' 步');
    realClick(document.querySelector('#tourSkip')); await sleep(250);
    ok('★ 跳过引导后关闭、解锁滚动，并写入「看过了」标记', tourBox.hidden === true &&
        !document.documentElement.classList.contains('touring') && !!localStorage.getItem('wcg.guided.v2'));

    /* ================= A. 卡片是真链接、点了真能进详情 ================= */
    const cover = document.querySelector('#feed .note .cover');
    const noteId = cover.dataset.note;
    ok('★ 卡片封面是真实 <a> 链接（带 href）', cover.tagName === 'A' && /^#\/note\//.test(cover.getAttribute('href')));
    ok('标题与作者也是真链接', (() => {
      const t = document.querySelector('#feed .note .title'), a = document.querySelector('#feed .note .author');
      return t.tagName === 'A' && a.tagName === 'A' && /^#\/note\//.test(t.getAttribute('href'));
    })());

    // 单击（桌面路径：应立即打开，无 240ms 延迟）
    clearAll(); history.replaceState(null, '', location.pathname);
    realClick(cover);
    await sleep(60);
    ok('★ 桌面单击卡片立即打开详情（无需等待）', document.querySelector('#sheetDetail').classList.contains('on'));
    ok('打开后 URL hash 同步（可分享/可后退）', location.hash === '#/note/' + noteId);
    document.querySelector('#sheetDetail [data-act="close"]').click();
    await sleep(80);
    ok('关闭详情会清掉 hash', location.hash === '' || location.hash === '#');

    // 双击：过去这里会「变成点赞、详情打不开」，是最严重的问题
    clearAll(); history.replaceState(null, '', location.pathname);
    const likeBefore = likeCount(noteId);
    realClick(cover); await sleep(110); realClick(cover); await sleep(120);
    ok('★ 桌面双击卡片仍然打开详情（不再被误判成双击点赞）',
       document.querySelector('#sheetDetail').classList.contains('on') && likeCount(noteId) === likeBefore);
    document.querySelector('#sheetDetail [data-act="close"]').click(); await sleep(80);

    // 深链
    clearAll(); location.hash = '#/note/' + noteId;
    window.dispatchEvent(new PopStateEvent('popstate'));
    await sleep(120);
    ok('★ #/note/id 深链可直接打开详情', document.querySelector('#sheetDetail').classList.contains('on'));
    history.replaceState(null, '', location.pathname);
    document.querySelector('#sheetDetail [data-act="close"]').click(); await sleep(80);

    /* ================= B. 导航按钮全部可达 ================= */
    const navs = [['feed','首页'], ['team','组队'], ['checkin','打卡'], ['guide','攻略'], ['me','我的'], ['calendar','假期'], ['about','关于']];
    let navOk = true;
    for(const [page] of navs){
      const rail = document.querySelector(`.rail-item[data-page="${page}"]`);
      realClick(rail); await sleep(60);
      if(pagesShown().join() !== 'page-' + page) navOk = false;
    }
    ok('★ 左侧栏 7 个导航（含假期/关于）都能切到对应页面', navOk);
    // 侧栏顺序：首页 / 组队 / 打卡 / 攻略 / 我的 / 假期 / 关于
    // —— 假期排在「我的」和「关于」之间（v2.9 调整）
    ok('★ 侧栏「假期」排在「我的」和「关于」之间', (() => {
      const items = [...document.querySelectorAll('.rail-nav > *')];
      const iMe = items.findIndex(e => e.dataset.page === 'me');
      const iCal = items.findIndex(e => e.dataset.page === 'calendar');
      const iAbout = items.findIndex(e => e.dataset.page === 'about');
      return iMe >= 0 && iCal === iMe + 1 && iAbout === iMe + 2;
    })());
    // 底部 Tab 只放 5 个导航：假期 / 关于 在移动端收进「我的 → 更多」，
    // 因为底部只有 5 格，再塞第 6、7 个横向就太挤了。
    const tbs = [...document.querySelectorAll('.tabbar .tb')];
    ok('★ 底部 Tab 恰好 5 个导航项', tbs.length === 5);
    ok('底部 Tab 里没有「假期」「关于」', !document.querySelector('.tb[data-page="calendar"]') && !document.querySelector('.tb[data-page="about"]'));
    let tabOk = true;
    for(const page of ['feed','team','checkin','guide','me']){
      const tb = document.querySelector(`.tb[data-page="${page}"]`);
      if(!tb){ tabOk = false; break; }
      realClick(tb); await sleep(60);
      if(pagesShown().join() !== 'page-' + page) tabOk = false;
    }
    ok('★ 底部 Tab 5 项都能切到对应页面', tabOk);

    // 「我的 → 更多」：假期 / 关于 的移动端入口
    go('me'); await sleep(150);
    const moreRows = [...document.querySelectorAll('#meMore .mrow')];
    ok('★ 我的页有「更多」分组，含假期与关于', moreRows.length === 2 &&
        !!document.querySelector('#meMore .mrow[data-page="calendar"]') &&
        !!document.querySelector('#meMore .mrow[data-page="about"]'));
    ok('「更多」分组里每一项都有说明文字', moreRows.every(r => (r.querySelector('.ts') || {}).textContent?.trim().length > 0));
    realClick(document.querySelector('#meMore .mrow[data-page="calendar"]')); await sleep(150);
    ok('★ 我的页「假期」入口真能进假期页', pagesShown().join() === 'page-calendar');
    go('me'); await sleep(120);
    realClick(document.querySelector('#meMore .mrow[data-page="about"]')); await sleep(150);
    ok('★ 我的页「关于」入口真能进关于页', pagesShown().join() === 'page-about');
    go('feed'); await sleep(120);
    ok('底部中间「发布」按钮打开发布面板', (() => {
      realClick(document.querySelector('#plusBtn'));
      return document.querySelector('#sheetForm').classList.contains('on');
    })());
    await sleep(80); clearAll();

    // 分类 chip
    const cat3 = document.querySelectorAll('#catbar .cat')[3];
    realClick(cat3); await sleep(80);
    ok('分类 Tab 可切换并重过滤', document.querySelector('#catbar .cat.on').dataset.cat === cat3.dataset.cat);
    realClick(document.querySelectorAll('#catbar .cat')[0]); await sleep(80);

    /* ================= C. 详情弹窗内按钮 ================= */
    // 首卡可能已经被示例数据标成「已赞」（a2/a6/a9），这时第一次点击是取消赞。
    // 所以断言写成「必须真的切换状态」，而不是死认 +1。
    const likeTarget = [...document.querySelectorAll('#feed .note')].map(n => n.dataset.id)
                         .find(id => !iLiked(id)) || noteId;
    openDetail(likeTarget); await sleep(100);
    const d = () => document.querySelector('#sheetDetail');
    // 点赞
    const c0 = likeCount(likeTarget), wasLiked = iLiked(likeTarget);
    d().querySelector('[data-big="1"]').click(); await sleep(80);
    ok('★ 详情「点赞」真实生效（状态翻转 + 计数 ±1）',
       iLiked(likeTarget) === !wasLiked && Math.abs(likeCount(likeTarget) - c0) === 1);
    ok('★ 详情「点赞」按钮文案跟着变', new RegExp(!wasLiked ? '已赞' : '点赞').test(d().querySelector('[data-big="1"]').textContent));
    d().querySelector('[data-big="1"]').click(); await sleep(80);
    ok('详情「点赞」可再次点击取消', likeCount(likeTarget) === c0 && iLiked(likeTarget) === wasLiked);
    // 组队出发（后面的用例都回到首卡 noteId，保持和 #tTitle 预填一致）
    openDetail(noteId); await sleep(100);
    d().querySelector('[data-act="quickteam"]').click(); await sleep(100);
    ok('★ 详情「组队出发」打开组队表单并预填活动名',
       document.querySelector('#sheetForm').classList.contains('on') &&
       document.querySelector('#tTitle') && document.querySelector('#tTitle').value === findAct(noteId).name);
    // 真的能提交并跳转
    document.querySelector('#tTime').value = '周六 15:00 校门口';
    const nT = store.teams.length;
    document.querySelector('#tCreate').click(); await sleep(120);
    ok('★ 组队表单提交后写入数据并跳到组队页', store.teams.length === nT + 1 && pagesShown().join() === 'page-team');
    // 我去打卡
    openDetail(noteId); await sleep(100);
    d().querySelector('[data-act="quickcheckin"]').click(); await sleep(100);
    const nC = store.checkins.length;
    document.querySelector('#cTitle').value = '按钮审计打卡';
    document.querySelector('#cAdd').click(); await sleep(120);
    ok('★ 打卡表单提交后写入数据并跳到打卡页', store.checkins.length === nC + 1 && pagesShown().join() === 'page-checkin');
    // 写攻略
    openDetail(noteId); await sleep(100);
    d().querySelector('[data-act="quickguide"]').click(); await sleep(100);
    const nG = store.guides.length;
    document.querySelector('#gTitle').value = '按钮审计攻略';
    document.querySelector('#gBody').value = '正文';
    document.querySelector('#gAdd').click(); await sleep(120);
    ok('★ 攻略表单提交后写入数据并跳到攻略页', store.guides.length === nG + 1 && pagesShown().join() === 'page-guide');
    // 复制活动信息（剪贴板可能不可用，但必须给出反馈）
    openDetail(noteId); await sleep(100);
    d().querySelector('[data-act="copyact"]').click(); await sleep(150);
    ok('详情「复制活动信息」有反馈（toast）', document.querySelector('#toast').textContent.length > 0);
    d().querySelector('[data-act="close"]').click(); await sleep(80);

    /* ================= D. 发布面板四个入口都能进 ================= */
    openPublish(null); await sleep(80);
    ok('发布面板有 4 个入口', document.querySelectorAll('.pubgrid button').length === 4);
    let pubOk = true;
    for(const [kind, sel] of [['team','#tTitle'], ['checkin','#cTitle'], ['guide','#gTitle'], ['activity','#nName']]){
      document.querySelector(`[data-act="pub"][data-kind="${kind}"]`).click(); await sleep(80);
      if(!document.querySelector(sel)) pubOk = false;
      openPublish(null); await sleep(60);
    }
    ok('★ 4 个入口分别打开对应表单', pubOk);
    // 自建活动提交
    openPublish('activity'); await sleep(80);
    const nA = store.activities.length;
    document.querySelector('#nName').value = '按钮审计活动';
    document.querySelector('#nAdd').click(); await sleep(120);
    ok('★ 自建活动提交后进入活动库', store.activities.length === nA + 1);
    // 提交按钮不被遮挡（粘性底栏）
    openPublish('checkin'); await sleep(120);
    const cAddBtn = document.querySelector('#cAdd');
    const rb = cAddBtn.getBoundingClientRect();
    ok('★ 打卡提交按钮始终在弹窗可视区内（不用下拉）',
       rb.top >= 0 && rb.bottom <= document.querySelector('#sheetForm').getBoundingClientRect().bottom + 1);
    ok('★ 提交按钮位于粘性底栏内', !!cAddBtn.closest('.form-actions'));
    document.querySelector('#sheetForm [data-act="close"]').click(); await sleep(80);

    /* ================= E. 顶栏 / 工具行 / 我的页按钮 ================= */
    // 换一批
    const feedBefore = document.querySelector('#feed').innerHTML.length;
    document.querySelector('#shuffleBtn').click(); await sleep(120);
    ok('「换一批」会重排信息流', document.querySelector('#feed').innerHTML.length > 0 && document.querySelectorAll('#feed .note').length > 0);
    // 筛选
    document.querySelector('#filterBtn').click(); await sleep(100);
    ok('「筛选」打开筛选面板', document.querySelector('#sheetForm').classList.contains('on') && !!document.querySelector('#fBudget'));
    const b = document.querySelector('#fBudget'); b.value = '30'; b.dispatchEvent(new Event('input', { bubbles:true }));
    await sleep(80);
    ok('筛选面板调节预算真实生效', prefs.budget === 30);
    const chip = document.querySelector('#fTypes .chip'); chip.click(); await sleep(80);
    ok('筛选面板类型多选真实生效', prefs.types.length === 1);
    document.querySelector('#resetPrefs').click(); await sleep(120);
    ok('「恢复默认」真实生效并重开面板', prefs.budget === 150 && !!document.querySelector('#fBudget'));
    document.querySelector('#sheetForm [data-act="close"]').click(); await sleep(80);
    // 帮我选
    document.querySelector('#askBtn').click(); await sleep(120);
    ok('「帮我选」打开一个详情', document.querySelector('#sheetDetail').classList.contains('on'));
    document.querySelector('#sheetDetail [data-act="close"]').click(); await sleep(80);
    // 主题
    const themeBefore = document.documentElement.dataset.theme;
    document.querySelector('#themeBtn').click(); await sleep(120);
    ok(`主题切换真实生效并落盘（${themeBefore} → ${document.documentElement.dataset.theme}）`,
       document.documentElement.dataset.theme !== themeBefore && !!localStorage.getItem('wcg.theme.v2'));
    document.querySelector('#railTheme').click(); await sleep(80);
    ok('侧栏主题按钮同样生效', document.documentElement.dataset.theme === themeBefore);
    // 同步面板
    document.querySelector('#railSync').click(); await sleep(120);
    ok('侧栏「跨设备同步」打开同步面板', document.querySelector('#sheetSync').classList.contains('on') && !!document.querySelector('#sNick'));
    document.querySelector('#sheetSync [data-act="joinbox"]').click(); await sleep(80);
    ok('同步面板「用房间码加入」展开输入框', document.querySelector('#joinBox') && document.querySelector('#joinBox').hidden === false);
    ok('同步面板有房间码输入框', !!document.querySelector('#roomInput'));
    document.querySelector('#sheetSync [data-act="close"]').click(); await sleep(80);

    // 我的页
    go('me'); await sleep(80);
    document.querySelector('#editNickBtn').click(); await sleep(100);
    document.querySelector('#nickEdit').value = '审计员';
    document.querySelector('#saveNick').click(); await sleep(100);
    ok('★ 编辑昵称真实保存', me.nick === '审计员');
    // 分享链接
    document.querySelector('#shareLinkBtn').click(); await sleep(150);
    ok('★「生成分享链接」产出可解码的链接', (() => {
      const ta = document.querySelector('#sheetForm textarea');
      if(!ta) return false;
      const m = ta.value.match(/#r=(.+)$/);
      if(!m) return false;
      try{ decodeState(m[1]); return true; }catch{ return false; }
    })());
    document.querySelector('#sheetForm [data-act="close"]').click(); await sleep(80);
    // 导入
    document.querySelector('#importBtn').click(); await sleep(100);
    ok('「导入 JSON」打开导入面板', !!document.querySelector('#impText') && !!document.querySelector('#doImport'));
    document.querySelector('#impText').value = JSON.stringify({ v:2, teams:[{ id:'imp1', owner:'导入者', title:'导入进来的队伍', cap:3, budget:0, members:[], ts:Date.now() }], checkins:[], guides:[], activities:[], likes:{}, tomb:[] });
    document.querySelector('#doImport').click(); await sleep(150);
    ok('★ 导入 JSON 真实写入数据', store.teams.some(t => t.id === 'imp1'));
    // 清除示例数据
    if(document.querySelector('#clearDemoBtn') && !document.querySelector('#clearDemoBtn').hidden){
      document.querySelector('#clearDemoBtn').click(); await sleep(120);
      ok('「清除示例数据」真实生效', !store.teams.some(t => t.demo));
    } else { ok('「清除示例数据」按钮可见（有示例数据时）', false); }

    /* ================= G. 本轮新增功能与修复项 ================= */
    // 前面的用例把示例数据清空了，这里补最少量的数据，保证依赖内容的用例有东西可测
    const ensureData = () => {
      // 注意判据是「有没有带标签的攻略」：可能已有攻略但都不带标签
      if(!store.guides.some(g => (g.tags || []).length))
        store.guides.unshift({ id:'tg' + Date.now(), title:'测试攻略', body:'正文', author:myNick(), date:ymd(new Date()), likedBy:[], tags:['免费','步行'], ts:Date.now() });
      if(!store.teams.length) store.teams.unshift({ id:'tt1', owner:'阿哲', title:'测试队伍', time:'周六 14:00', cap:4, budget:50, members:['阿哲'], ts:Date.now() });
      if(!store.checkins.length) store.checkins.unshift({ id:'tc1', owner:myNick(), title:'测试打卡', date:ymd(new Date()), cost:20, hours:2, mood:'🤩', note:'', ts:Date.now() });
      persistStore(); renderAll();
    };
    ensureData(); go('feed'); await sleep(180);

    // 1) 卡片整块可点：用 elementFromPoint 做真实命中测试
    //    （合成事件不经过浏览器命中测试，直接 dispatch 到 .footer 是不准的）
    const noteEl = document.querySelector('#feed .note');
    clearAll(); history.replaceState(null, '', location.pathname);
    const titleEl = noteEl.querySelector('.title');
    titleEl.scrollIntoView({ block:'center' });          // 先把标题滚进视口，否则取点在视口外
    await sleep(200);
    const afterStyle = getComputedStyle(titleEl, '::after');
    ok('★ 卡片整块可点（标题链接 ::after 铺满整卡）',
       afterStyle.position === 'absolute' && parseFloat(afterStyle.top) === 0);
    const cr = noteEl.getBoundingClientRect(), tr = titleEl.getBoundingClientRect();
    const vh = document.documentElement.clientHeight;
    const cands = [[cr.right - 6, tr.top + 6], [tr.left + 4, tr.top - 5], [cr.right - 6, tr.bottom + 8]];
    let hitEl = null;
    for(const [x, y] of cands){
      if(y < 4 || y > vh - 4) continue;                  // 视口外的点 elementFromPoint 返回 null
      const e2 = document.elementFromPoint(x, y);
      if(e2 && e2.closest('[data-note]')){ hitEl = e2.closest('[data-note]'); break; }
    }
    ok('★ 卡片空白处命中的是卡片链接（整卡可点）', !!hitEl);
    if(hitEl){ realClick(hitEl); await sleep(150); }
    ok('★ 点卡片空白处也能打开详情', document.querySelector('#sheetDetail').classList.contains('on'));
    closeSheet(); history.replaceState(null, '', location.pathname); await sleep(80);

    // 1b) 逐张验证：不能只有第一张能点，任何一张都得能打开详情
    closeSheet(); go('feed'); await sleep(200);
    const allCardIds = [...document.querySelectorAll('#feed .note')].map(n => n.dataset.id);
    const badCards = [];
    for(const id of allCardIds){
      closeSheet(); history.replaceState(null, '', location.pathname);
      const el = document.querySelector(`#feed .note[data-id="${id}"] .cover`);
      if(!el){ badCards.push(id + '(缺失)'); continue; }
      realClick(el);
      await sleep(70);
      if(!document.querySelector('#sheetDetail').classList.contains('on')) badCards.push(id);
    }
    ok(`★ 全部 ${allCardIds.length} 张推荐卡片都能点开详情${badCards.length ? ' → 失败：' + badCards.join(', ') : ''}`,
       allCardIds.length > 0 && badCards.length === 0);
    // 逐张验证点赞按钮也没被卡片整块点击区盖住
    const badLikes = [];
    for(const id of allCardIds.slice(0, 6)){
      const el = document.querySelector(`#feed .note[data-id="${id}"] .like-wrapper`);
      if(!el){ badLikes.push(id + '(缺失)'); continue; }
      const c = likeCount(id);
      realClick(el); await sleep(60);
      if(likeCount(id) === c) badLikes.push(id);
    }
    ok(`★ 卡片点赞按钮未被整卡点击区遮挡${badLikes.length ? ' → 失败：' + badLikes.join(', ') : ''}`, badLikes.length === 0);
    closeSheet(); history.replaceState(null, '', location.pathname); await sleep(60);

    // 2) 攻略页标签 chip 不再是死按钮
    go('guide'); await sleep(150);
    const tagChip = document.querySelector('#guideList .chip[data-tag]');
    ok('攻略标签是可点的筛选入口', !!tagChip && !!tagChip.dataset.tag);
    if(tagChip){
      realClick(tagChip); await sleep(160);
      ok('★ 点攻略标签会跳首页并按标签筛选',
         pagesShown().join() === 'page-feed' && document.querySelector('#q').value === tagChip.dataset.tag);
      document.querySelector('#q').value = ''; document.querySelector('#q').dispatchEvent(new Event('input', { bubbles:true }));
      await sleep(120);
    } else { ok('★ 点攻略标签会跳首页并按标签筛选', false); }

    // 3) 复制按钮即时反馈
    go('guide'); await sleep(150);
    document.querySelector('#toast').textContent = '';
    const copyBtn = document.querySelector('#guideList [data-act="copyg"]');
    ok('攻略复制按钮存在', !!copyBtn);
    if(copyBtn){
      realClick(copyBtn);
      await sleep(40);
      ok('★ 点「复制」立即有反馈（不再等剪贴板返回）', document.querySelector('#toast').textContent.length > 0);
    } else { ok('★ 点「复制」立即有反馈（不再等剪贴板返回）', false); }

    // 4) 导入支持选择文件
    go('me'); await sleep(150);
    document.querySelector('#importBtn').click(); await sleep(140);
    ok('★ 导入面板支持选择 JSON 文件', !!document.querySelector('#impFile') && document.querySelector('#impFile').type === 'file');
    closeSheet(); await sleep(80);

    // 5) 清空＝两步确认 + 写墓碑
    go('me'); await sleep(150);
    const beforeClear = store.teams.length;
    const clearBtn = document.querySelector('#clearBtn');
    realClick(clearBtn); await sleep(90);
    ok('第一次点击只是「待确认」，不会立刻清空', clearBtn.dataset.armed === '1' && store.teams.length === beforeClear);
    ok('按钮文案提示再点一次', /再点一次/.test(clearBtn.textContent));
    realClick(clearBtn); await sleep(150);
    ok('★ 第二次点击真正清空', store.teams.length === 0 && store.checkins.length === 0 && store.guides.length === 0);
    ok('★ 清空写入墓碑（云端不会把数据合并回来）', (store.tomb || []).length > 0);

    // 6) 我的页统计可点击跳转
    seedDemo(); renderAll(); go('me'); await sleep(180);
    const statBtns = [...document.querySelectorAll('#meStats .stat')];
    ok('我的数据 4 项都可点击', statBtns.length === 4 && statBtns.every(b => b.dataset.page || b.dataset.jump));
    realClick(document.querySelector('#meStats .stat[data-page="team"]')); await sleep(140);
    ok('★ 点「我发起的队」跳到组队页', pagesShown().join() === 'page-team');
    go('me'); await sleep(120);
    realClick(document.querySelector('#meStats .stat[data-page="checkin"]')); await sleep(140);
    ok('★ 点「打卡」跳到打卡页', pagesShown().join() === 'page-checkin');
    go('me'); await sleep(120);
    realClick(document.querySelector('#meStats .stat[data-page="guide"]')); await sleep(140);
    ok('★ 点「攻略」跳到攻略页', pagesShown().join() === 'page-guide');

    // 7) 非首页不显示分类导航条
    ok('★ 非首页不显示顶部分类导航条', document.querySelector('.catbar').hidden === true);
    go('feed'); await sleep(120);
    ok('回到首页重新显示分类导航条', document.querySelector('.catbar').hidden === false);

    // 8) 假期页（v2.8 由「光阴」改名「日历」，v2.9 再改名「假期」）
    go('calendar'); await sleep(250);
    ok('★ 日历页渲染出日历', !!document.querySelector('#calGrid') && document.querySelectorAll('#calGrid .cal-day').length >= 28);
    ok('日历标出了周末', document.querySelectorAll('#calGrid .cal-day.wk').length >= 4);
    ok('日历里有法定假期标记', document.querySelectorAll('#calGrid .cal-day.hol').length + document.querySelectorAll('#calGrid .cal-day.work').length >= 0);
    ok('日历高亮今天（仅一个）', document.querySelectorAll('#calGrid .cal-day.today').length === 1);
    ok('★ 有出行提醒（假期倒计时/调休/周末天气）', document.querySelectorAll('#calAlerts .cal-alert').length >= 2);
    // v2.8：提醒从「整行大色块」压成一行内联小胶囊
    ok('★ 假期提醒胶囊带 data-tip，点一下会弹出完整说明（触屏可达）', (() => {
      const tips = [...document.querySelectorAll('#calAlerts .cal-alert[data-tip]')];
      if(tips.length < 2) return false;
      realClick(tips[0]);
      return document.querySelector('#toast').textContent === tips[0].dataset.tip;
    })());
    ok('★ 提醒改成一行内联胶囊（不是一叠大色块）', (() => {
      const box = document.querySelector('#calAlerts');
      const items = [...box.querySelectorAll('.cal-alert')];
      return getComputedStyle(box).display === 'flex' && items.length >= 2 &&
        items.every(e => e.getBoundingClientRect().height <= 32);
    })());
    ok('★ 日历格子压矮（≤48px，一屏能多放）',
       document.querySelector('#calGrid .cal-day').getBoundingClientRect().height <= 48);
    ok('★ 列出 2026 年放假安排 7 条（紧凑两列列表）', (() => {
      const list = document.querySelector('#holidayList');
      return list.querySelectorAll('.cal-hol').length === 7 && getComputedStyle(list).display === 'grid';
    })());
    const calTitle0 = document.querySelector('#calTitle').textContent;
    realClick(document.querySelector('#calNext')); await sleep(140);
    ok('★ 日历可切到下个月', document.querySelector('#calTitle').textContent !== calTitle0);
    realClick(document.querySelector('#calToday')); await sleep(140);
    ok('★「回到今天」可用', document.querySelector('#calTitle').textContent === calTitle0);
    // 假期/关于 不再是底部 Tab，停在这两页时底部应高亮「我的」（它们是我的的子页）
    ok('★ 假期页时底部高亮「我的」而不是全灭', (() => {
      const meTab = document.querySelector('.tb[data-page="me"]');
      return meTab.classList.contains('on') && !document.querySelector('.tb[data-page="feed"]').classList.contains('on');
    })());
    ok('★ 假期页时侧栏高亮的是「假期」本身', document.querySelector('.rail-item[data-page="calendar"]').classList.contains('on') &&
        document.querySelectorAll('.rail-item.on').length === 1);
    go('about'); await sleep(150);
    ok('★ 关于页时底部同样高亮「我的」', document.querySelector('.tb[data-page="me"]').classList.contains('on'));
    go('feed'); await sleep(120);

    // 9) 关于页 = 新手指引 + 项目说明（v2.9 起）
    go('about'); await sleep(180);
    const about = document.querySelector('#page-about');
    const paneGuide = () => document.querySelector('#aboutGuide');
    const paneReadme = () => document.querySelector('#aboutReadme');
    ok('★ 关于页有两个标签：新手指引 / 项目说明', document.querySelectorAll('#aboutTabs .atab').length === 2 &&
        !!document.querySelector('#aboutTabGuide') && !!document.querySelector('#aboutTabReadme'));
    ok('★ 已经看过引导，所以进入关于页默认显示「项目说明」', paneReadme().hidden === false && paneGuide().hidden === true);
    realClick(document.querySelector('#aboutTabGuide')); await sleep(150);
    ok('★ 点「新手指引」能切到引导面板', paneGuide().hidden === false && paneReadme().hidden === true &&
        document.querySelector('#aboutTabGuide').classList.contains('on'));
    ok('★ 引导面板列出全部步骤（条数 = TOUR 步数）',
       document.querySelectorAll('#guideSteps .gstep').length === TOUR.length &&
       document.querySelectorAll('#guideSteps .gstep').length >= 8);
    ok('每一步都有标题与一句话说明', [...document.querySelectorAll('#guideSteps .gstep')].every(g =>
        (g.querySelector('b') || {}).textContent?.trim().length > 0 && (g.querySelector('small') || {}).textContent?.trim().length > 0));
    // 回放：点某一步 → 从那一步开始
    realClick(document.querySelectorAll('#guideSteps .gstep')[6]); await sleep(300);
    ok('★ 点第 7 步能从那一步开始回放', !document.querySelector('#tour').hidden &&
        document.querySelector('#tourStepNo').textContent === '第 7 / ' + TOUR.length + ' 步');
    ok('★ 回放时锁滚动、且遮罩盖住页面', document.documentElement.classList.contains('touring'));
    realClick(document.querySelector('#tourSkip')); await sleep(250);
    ok('★ 回放中「跳过」能结束', document.querySelector('#tour').hidden === true);
    realClick(document.querySelector('#guidePlay')); await sleep(300);
    ok('★ 「开始引导」按钮从第 1 步重放', !document.querySelector('#tour').hidden &&
        document.querySelector('#tourStepNo').textContent === '第 1 / ' + TOUR.length + ' 步');
    realClick(document.querySelector('#tourNext')); await sleep(250);
    ok('★ 重放时「下一步」有效（切到第 2 步）', document.querySelector('#tourStepNo').textContent === '第 2 / ' + TOUR.length + ' 步');
    realClick(document.querySelector('#tourSkip')); await sleep(220);
    // 项目说明 = 原来的 README 内容
    realClick(document.querySelector('#aboutTabReadme')); await sleep(150);
    ok('★「项目说明」写入了 README 内容', about.textContent.includes('技术栈') && about.textContent.includes('已知限制') && about.textContent.includes('质量验证'));
    ok('项目说明标明数据来源', about.textContent.includes('Open-Meteo') && about.textContent.includes('textdb.dev') && about.textContent.includes('国办发明电'));
    // v2.8：从「h2 + 大段文字」改成块状排版
    ok('★ 项目说明是块状排版（hero 卡 + 卡片网格）', !!about.querySelector('.about-hero') &&
        paneReadme().querySelectorAll('.feat-grid .feat').length >= 8 &&
        paneReadme().querySelectorAll('.about-sec').length >= 4);
    ok('★ 关于页不再出现「小红书」字样', !/小红书/.test(about.textContent));
    ok('★ 侧栏已去掉 logo 与版本页脚', !document.querySelector('.rail-logo') && !document.querySelector('.rail-foot'));
    ok('★ 侧栏「关于」与首页/打卡同在一组（在区隔线之前）', (() => {
      const items = [...document.querySelectorAll('.rail-nav > *')];
      const sep = items.findIndex(e => e.classList.contains('rail-sep'));
      const home = items.findIndex(e => e.dataset.page === 'feed');
      const about = items.findIndex(e => e.dataset.page === 'about');
      return sep > 0 && home >= 0 && about > home && about < sep;
    })());
    ok('★ 侧栏导航整体垂直居中（不靠上对齐）', (() => {
      const rail = document.querySelector('.rail'), nav = document.querySelector('.rail-nav');
      const cs = getComputedStyle(rail);
      if(cs.justifyContent !== 'center') return false;        // CSS 层面任何视口都能断言
      const r = rail.getBoundingClientRect(), n = nav.getBoundingClientRect();
      if(!r.height || !n.height) return true;                 // 窄屏侧栏隐藏，几何量不到（1280px 由布局套件验证）
      return Math.abs((r.top + r.height / 2) - (n.top + n.height / 2)) < 6;
    })());

    // 10) 天气条同时给出周六与周日 + 倒计时
    go('feed'); await sleep(200);
    const wb = document.querySelector('#weatherBar');
    ok('★ 天气条同时显示周六与周日', wb.querySelectorAll('.wday').length === 2 &&
        /周六/.test(wb.textContent) && /周日/.test(wb.textContent));
    ok('★ 天气条给出距周末/假期倒计时', /距周末/.test(wb.textContent) && /假期|中秋|国庆|元旦/.test(wb.textContent));
    // v2.8：从「两个大白块 + 一列文字」改成紧凑胶囊条
    ok('★ 天气条是紧凑胶囊条（高度小、带主题色、仍然显示城市）', (() => {
      const cs = getComputedStyle(wb);
      const chips = [...wb.querySelectorAll('.wchip')];
      const themed = cs.backgroundColor !== 'rgba(0, 0, 0, 0)' && cs.backgroundColor !== 'rgb(245, 245, 245)';
      return cs.display === 'flex' && chips.length >= 5 && themed && /上海/.test(wb.textContent);
    })());
    ok('★ 天气条的城市用图标标出（不是光秃秃三个字）', !!wb.querySelector('.wchip.city .ri'));
    // v2.8：高度预算按实测值定（宽屏 1280/1440 = 40px 单行；731/900 = 74px 两行；375 = 131px 四行）
    // v3.0：天气描述 / 降水概率这些长尾信息原来只写在 title 里 —— 触屏没有悬停，
    // 手机上等于看不到。现在同时写 data-tip，点一下弹出来。
    ok('★ 天气胶囊带 data-tip（触屏也能看到长尾信息）',
       document.querySelectorAll('#weatherBar .wchip[data-tip]').length >= 3);
    const chipTip = document.querySelector('#weatherBar .wchip[data-tip]');
    const chipTipText = chipTip.dataset.tip;
    realClick(chipTip); await sleep(150);
    ok('★ 点天气胶囊会弹出说明（不是「点了没反应」）',
       document.querySelector('#toast').classList.contains('on') &&
       document.querySelector('#toast').textContent === chipTipText);
    ok('★ 天气条高度符合紧凑预算（宽屏 ≤48 / 中屏 ≤90 / 窄屏 ≤140）', (() => {
      const h = wb.getBoundingClientRect().height;
      const vw = document.documentElement.clientWidth;
      const budget = vw >= 1024 ? 48 : vw >= 600 ? 90 : 140;
      if(h > 0 && h > budget) console.warn('天气条高 ' + Math.round(h) + 'px，超出 ' + vw + 'px 下的预算 ' + budget);
      return h > 0 && h <= budget;
    })());

    /* ================= H. 通用审计：页面上不能有「点了没反应」的按钮 =================
       用选择器而不是元素引用：点分类/换一批会重渲染信息流，旧引用会脱离 DOM 被误判成死按钮。 */
    seedDemo(); renderTeams(); renderCheckins(); renderGuides(); renderMe(); renderFeed();
    go('feed'); await sleep(120);
    const sel = [
      '#railPublish', '#railSync', '#railTheme', '#postMini', '#syncBtn', '#themeBtn',
      '#shuffleBtn', '#filterBtn', '#plusBtn',
      ...['feed','calendar','team','checkin','guide','me','about'].map(p => `.rail-item[data-page="${p}"]`),
      ...['feed','team','checkin','guide','me'].map(p => `.tb[data-page="${p}"]`),
      '#meMore .mrow[data-page="calendar"]', '#meMore .mrow[data-page="about"]',
      '#aboutTabGuide', '#aboutTabReadme', '#guidePlay',
      ...document.querySelectorAll('#catbar .cat').length ? ['#catbar .cat:nth-child(2)', '#catbar .cat:nth-child(5)'] : []
    ];
    const dead = [];
    let audited = 0;
    for(const s of sel){
      const el = document.querySelector(s);
      if(!el || el.offsetWidth === 0) continue;      // 不存在或不可见（如桌面下的底部 Tab）
      if(el.classList.contains('on')) continue;      // 已激活的导航/分类：再点一次本就无变化，幂等
      const before = snap();
      realClick(el);
      await sleep(70);
      const after = snap();
      if(after === before && el.isConnected) dead.push(s);
      audited++;
      clearAll();
      if(document.querySelector('#sheetForm').classList.contains('on')) closeSheet();
      if(document.querySelector('#sheetDetail').classList.contains('on')) closeSheet();
      if(document.querySelector('#sheetSync').classList.contains('on')) closeSheet();
      await sleep(40);
    }
    // 卡片上的点赞按钮单独逐个验证
    const likeIds = [...document.querySelectorAll('#feed .note')].slice(0, 4).map(n => n.dataset.id);
    for(const id of likeIds){
      const el = document.querySelector(`.note[data-id="${id}"] .like-wrapper`);
      if(!el) continue;
      const c = likeCount(id);
      realClick(el);
      await sleep(70);
      if(likeCount(id) === c) dead.push('like#' + id);
      audited++;
    }
    // 「关于」页里的按钮只在切到关于页时才可见，单独审一遍
    go('about'); await sleep(180);
    const aboutSel = ['#aboutTabGuide', '#aboutTabReadme', '#guidePlay',
                      '#guideSteps .gstep:nth-child(2)', '#tourSkip'];
    for(const sel2 of aboutSel){
      const el = document.querySelector(sel2);
      if(!el || el.offsetWidth === 0) continue;
      if(el.classList.contains('on')) continue;
      const before = snap();
      realClick(el);
      await sleep(120);
      const after = snap();
      if(after === before && el.isConnected) dead.push('about:' + sel2);
      audited++;
      clearAll();
      await sleep(40);
    }
    go('feed'); await sleep(120);
    ok(`★ 全站按钮审计：抽查 ${audited} 个可交互元素，无「点了没反应」的按钮${dead.length ? ' → ' + dead.join(', ') : ''}`, dead.length === 0);
  }catch(e){
    R.push('FAIL :: 运行异常 ' + (e && e.message));
  }
  const fails = R.filter(r => r.startsWith('FAIL'));
  document.querySelector('#TESTOUT').textContent = 'TESTS ' + (R.length - fails.length) + '/' + R.length + ' PASSED\n' + R.join('\n');
  document.title = fails.length ? ('TESTS FAILED: ' + fails.length) : 'TESTS OK';
})();
</script>
