<pre id="TESTOUT" style="display:none"></pre>
<script>
(async function(){
  const R = [];
  const ok = (n, c) => R.push((c ? 'PASS' : 'FAIL') + ' :: ' + n);
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const waitFor = async (fn, tries = 40) => { for(let i = 0; i < tries; i++){ if(fn()) return true; await sleep(150); } return false; };
  const EMOJI = /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u;
  /* 无头浏览器的虚拟时钟不推进 CSS transition，属性会永远停在起始值
     （例如弹窗的 transform 一直等于 translateY(102%)），布局断言就没法量。
     这里注入样式把过渡/动画关掉，让最终布局立即生效 —— 只影响测试环境。 */
  const KILL = '*,*::before,*::after{transition:none !important;animation:none !important}';
  const inject = doc => {
    try { const s = doc.createElement('style'); s.textContent = KILL; doc.head.appendChild(s); } catch(e){}
  };
  const mkFrame = (w, h) => new Promise(res => {
    const f = document.createElement('iframe');
    f.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px;border:0`;
    f.src = './index.html';                   // 注入页与 index.html 同级（都在仓库根目录）
    f.onload = async () => {
      inject(f.contentDocument);
      await waitFor(() => f.contentDocument.querySelectorAll('#feed .note').length > 0, 60);
      res(f);
    };
    document.body.appendChild(f);
  });
  const noOverflow = d => d.body.scrollWidth <= d.documentElement.clientWidth + 1;

  try{
    /* ============ A. 当前视口（无头默认 ~731px，走移动端布局） ============ */
    /* 等 init 跑完（注入片段在主脚本之前执行，这里必须等），顺便等第一次访问的强制引导弹出来。
       先断言它确实弹了，再关掉 —— 它锁滚动、还会切页面，后面的几何断言必须在关掉之后做。
       （关掉会写入 localStorage 标记；同源的 iframe 会读到，所以下面的 iframe 里不会自动弹。） */
    await waitFor(() => document.querySelectorAll('#feed .note').length > 0, 40);
    const tourOuter = document.querySelector('#tour');
    ok('★ 首次访问自动弹出新手引导（遮挡全屏的模态层）', !!tourOuter && !tourOuter.hidden &&
       getComputedStyle(tourOuter).position === 'fixed' && +getComputedStyle(tourOuter).zIndex > 80);
    document.querySelector('#tourSkip').click();
    await sleep(220);
    ok('关掉引导后遮罩消失、滚动解锁', tourOuter.hidden === true &&
       !document.documentElement.classList.contains('touring') && !!localStorage.getItem('wcg.guided.v2'));

    inject(document);                       // 先关掉过渡，保证下面的几何量测是最终值
    ok('分类条共 11 项（推荐 + 10 类）', document.querySelectorAll('#catbar .cat').length === 11);
    ok('分类条为纯文字（无 emoji）',
       [...document.querySelectorAll('#catbar .cat')].every(e => !EMOJI.test(e.textContent)));
    ok('顶栏为 sticky', getComputedStyle(document.querySelector('.topbar')).position === 'sticky');
    ok('分类条位于 sticky 容器内部（否则吸不住顶）',
       document.querySelector('.topbar').contains(document.querySelector('.catbar')));
    ok('信息流渲染出真实卡片', document.querySelectorAll('#feed .note').length > 0);

    const note = document.querySelector('#feed .note');
    ok('卡片无白色盒子（无边框 + 透明底）', (() => {
      const cs = getComputedStyle(note);
      return cs.backgroundColor === 'rgba(0, 0, 0, 0)' && cs.borderTopWidth === '0px';
    })());
    ok('封面为圆角', parseFloat(getComputedStyle(document.querySelector('#feed .note .cover')).borderRadius) >= 8);
    ok('★ 卡片默认可见：不依赖动画/过渡', (() => {
      const clone = note.cloneNode(true);
      clone.classList.remove('anim');
      document.querySelector('#feed').appendChild(clone);
      const o = getComputedStyle(clone).opacity;
      clone.remove();
      return o === '1';
    })());
    // 入场动画是 IO 异步补的，等一下再看（这里只验证渐进增强确实生效，不依赖它显形）
    ok('卡片带入场动画类名 anim（渐进增强）', await waitFor(() => document.querySelector('#feed .note.anim'), 20));

    /* ============ B. 窄屏 iframe：375px 手机 ============ */
    const m = await mkFrame(375, 700);
    const md = m.contentDocument, mw = m.contentWindow;
    ok('375px：左侧导航隐藏', mw.getComputedStyle(md.querySelector('.rail')).display === 'none');
    ok('375px：底部 Tab 显示', mw.getComputedStyle(md.querySelector('.tabbar')).display !== 'none');
    ok('375px：瀑布流 2 列', md.querySelectorAll('#feed .mcol').length === 2);
    ok('375px：★ 无横向溢出', noOverflow(md));
    ok('375px：5 个底部 Tab 全在视口内', (() => {
      const items = [...md.querySelectorAll('.tabbar .tb')], vw = md.documentElement.clientWidth;
      return items.length === 5 && items.every(e => { const r = e.getBoundingClientRect(); return r.right <= vw + 1 && r.left >= -1; });
    })());
    ok('★ 375px：「我的」页里能看到「更多」（假期/关于入口）', (() => {
      mw.go('me');                                   // #page-me 默认 hidden，量宽度前必须先切过去
      const box = md.querySelector('#meMore');
      const rows = [...md.querySelectorAll('#meMore .mrow')];
      const shown = !!box && mw.getComputedStyle(box).display !== 'none' &&
        rows.length === 2 && rows.every(r => r.getBoundingClientRect().width > 0);
      mw.go('feed');
      return shown;
    })());
    ok('375px：卡片宽度合理（两列各占约一半）', (() => {
      const cs = [...md.querySelectorAll('#feed .mcol .note')].slice(0, 2).map(e => e.getBoundingClientRect().width);
      const vw = md.documentElement.clientWidth;
      return cs.length === 2 && cs.every(w => w > vw * 0.35 && w < vw * 0.6);
    })());
    ok('375px：顶栏搜索框在视口内', (() => {
      const r = md.querySelector('.searchbox').getBoundingClientRect();
      return r.left >= -1 && r.right <= md.documentElement.clientWidth + 1;
    })());

    /* v2.9：新手引导在手机上的对位 —— 高亮框必须套住目标，说明卡不能跑出屏幕 */
    mw.startTour(1);                                   // 第 2 步：高亮首页天气条
    await sleep(260);
    ok('★ 375px：引导高亮框精确套住天气条', (() => {
      const hole = md.querySelector('#tourHole');
      if(hole.hidden) return false;
      const r = md.querySelector('#weatherBar').getBoundingClientRect();
      const h = hole.getBoundingClientRect();
      return Math.abs(h.left - Math.max(r.left - 6, 4)) < 3 && Math.abs(h.top - Math.max(r.top - 6, 4)) < 3 &&
             Math.abs(h.right - Math.min(r.right + 6, md.documentElement.clientWidth - 4)) < 3;
    })());
    ok('★ 375px：说明卡完整落在视口内（不溢出左右，也不被挤出上下）', (() => {
      const t = md.querySelector('#tourTip').getBoundingClientRect();
      const vw = md.documentElement.clientWidth, vh = md.documentElement.clientHeight;
      return t.left >= 0 && t.right <= vw + 1 && t.top >= -1 && t.bottom <= vh + 1;
    })());
    ok('375px：引导期间锁住滚动', md.documentElement.classList.contains('touring'));
    mw.endTour(false); await sleep(150);
    ok('375px：结束引导后遮罩关闭、滚动解锁', md.querySelector('#tour').hidden === true &&
       !md.documentElement.classList.contains('touring'));

    /* 关于页在手机上是单列（步骤列表）。先点「新手指引」标签 —— 面板 hidden 时所有 rect 都是 0，
       那样断言不量不到任何东西（曾经因此假红过一次）。 */
    mw.go('about'); await sleep(160);
    md.querySelector('#aboutTabGuide').click(); await sleep(150);
    ok('★ 375px：关于页的引导步骤列表是单列', (() => {
      const items = [...md.querySelectorAll('#guideSteps .gstep')];
      const shown = items.filter(e => e.getBoundingClientRect().width > 0);
      const rows = new Set(shown.map(e => Math.round(e.getBoundingClientRect().top)));
      return items.length >= 8 && shown.length === items.length && rows.size === items.length;
    })());
    ok('375px：关于页两个标签都在视口内且可点', (() => {
      const tabs = [...md.querySelectorAll('#aboutTabs .atab')];
      const vw = md.documentElement.clientWidth;
      return tabs.length === 2 && tabs.every(t => {
        const r = t.getBoundingClientRect();
        return r.left >= -1 && r.right <= vw + 1 && r.height >= 30;
      });
    })());
    mw.go('feed'); await sleep(120);

    /* ============ C. 宽屏 iframe：1280px 桌面 ============ */
    const d = await mkFrame(1280, 820);
    const dd = d.contentDocument, dw = d.contentWindow;
    ok('1280px：左侧导航显示', dw.getComputedStyle(dd.querySelector('.rail')).display === 'flex');
    ok('1280px：底部 Tab 隐藏', dw.getComputedStyle(dd.querySelector('.tabbar')).display === 'none');
    ok('1280px：瀑布流 ≥4 列', dd.querySelectorAll('#feed .mcol').length >= 4);
    ok('1280px：主内容避开侧栏（shell 左移留白）', dd.querySelector('.shell').getBoundingClientRect().left >= 150);
    ok('1280px：搜索框基本居中', (() => {
      const r = dd.querySelector('.searchbox').getBoundingClientRect();
      const expect = (dd.documentElement.clientWidth + 200) / 2;   // 内容区（右侧 200px 侧栏）的中心
      return Math.abs((r.left + r.right) / 2 - expect) < 140;
    })());
    ok('1280px：显示器上不出现底部 Tab 的遮挡留白', parseFloat(dw.getComputedStyle(dd.querySelector('.masonry')).paddingBottom) < 60);
    ok('1280px：★ 无横向溢出', noOverflow(dd));
    ok('1280px：侧栏导航项 ≥8 个且有高亮', (() => {
      const items = dd.querySelectorAll('.rail-item');
      return items.length >= 8 && dd.querySelectorAll('.rail-item.on').length === 1;
    })());
    ok('★ 1280px：侧栏导航垂直居中', (() => {
      const rail = dd.querySelector('.rail'), nav = dd.querySelector('.rail-nav');
      if(dw.getComputedStyle(rail).justifyContent !== 'center') return false;
      const r = rail.getBoundingClientRect(), n = nav.getBoundingClientRect();
      return Math.abs((r.top + r.height / 2) - (n.top + n.height / 2)) < 6;
    })());
    ok('★ 1280px：侧栏「关于」在主导航组内（与首页同级）', (() => {
      const items = [...dd.querySelectorAll('.rail-nav > *')];
      const sep = items.findIndex(e => e.classList.contains('rail-sep'));
      const home = items.findIndex(e => e.dataset.page === 'feed');
      const about = items.findIndex(e => e.dataset.page === 'about');
      return sep > 0 && home >= 0 && about > home && about < sep;
    })());
    ok('★ 1280px：侧栏「假期」排在「我的」和「关于」之间', (() => {
      const items = [...dd.querySelectorAll('.rail-nav > *')];
      const iMe = items.findIndex(e => e.dataset.page === 'me');
      const iCal = items.findIndex(e => e.dataset.page === 'calendar');
      const iAbout = items.findIndex(e => e.dataset.page === 'about');
      return iMe >= 0 && iCal === iMe + 1 && iAbout === iMe + 2;
    })());

    /* v2.9：桌面端的新手引导对位 + 关于页两列 */
    dw.startTour(4);                                   // 第 5 步：高亮信息流第一张卡
    await sleep(260);
    ok('★ 1280px：引导高亮框精确套住目标卡片', (() => {
      const hole = dd.querySelector('#tourHole');
      if(hole.hidden) return false;
      const cards = [...dd.querySelectorAll('#feed .note')].filter(n => !n.hidden);
      if(!cards.length) return false;
      const r = cards[0].getBoundingClientRect(), h = hole.getBoundingClientRect();
      return Math.abs(h.left - Math.max(r.left - 6, 4)) < 3 && Math.abs(h.top - Math.max(r.top - 6, 4)) < 3;
    })());
    ok('★ 1280px：说明卡完整落在视口内', (() => {
      const t = dd.querySelector('#tourTip').getBoundingClientRect();
      const vw = dd.documentElement.clientWidth, vh = dd.documentElement.clientHeight;
      return t.left >= 0 && t.right <= vw + 1 && t.top >= -1 && t.bottom <= vh + 1;
    })());
    dw.endTour(false); await sleep(150);
    ok('1280px：结束引导后遮罩关闭', dd.querySelector('#tour').hidden === true);
    dw.go('about'); await sleep(160);
    ok('★ 1280px：看过引导后关于页默认显示「项目说明」（引导面板是收起的）',
       dd.querySelector('#aboutReadme').hidden === false && dd.querySelector('#aboutGuide').hidden === true);
    dd.querySelector('#aboutTabGuide').click(); await sleep(150);
    ok('★ 1280px：关于页的引导步骤列表是两列', (() => {
      const items = [...dd.querySelectorAll('#guideSteps .gstep')];
      const shown = items.filter(e => e.getBoundingClientRect().width > 0);
      const cols = new Set(shown.map(e => Math.round(e.getBoundingClientRect().left)));
      const rows = new Set(shown.map(e => Math.round(e.getBoundingClientRect().top)));
      // 步数是奇数，最后一行只有一张卡 —— 行数按 ceil(n/2) 算
      return shown.length === items.length && items.length >= 8 && cols.size === 2 &&
             rows.size === Math.ceil(items.length / 2);
    })());
    dw.go('feed'); await sleep(120);
    ok('★ 1280px：「我的」页不出现移动端的「更多」入口（桌面走左侧栏）', (() => {
      dw.go('me');
      const box = dd.querySelector('#meMore');
      const hidden = !!box && dw.getComputedStyle(box).display === 'none';
      dw.go('feed');
      return hidden;
    })());

    /* v2.8：假期页要求「一进来就能看完日历 / 天气 / 假期提醒」，不用往下滑。
       直接在 1280×820 的精确视口里量最后一个内容的 bottom，超出视口就是需要滚动。 */
    ok('★ 1280px：假期页一屏看完，不用滚动', (() => {
      dw.go('calendar');
      const vh = dd.documentElement.clientHeight;
      const alerts = dd.querySelector('#calAlerts').getBoundingClientRect();
      const grid = dd.querySelector('#calGrid').getBoundingClientRect();
      const hols = dd.querySelector('#holidayList').getBoundingClientRect();
      const fits = alerts.top >= 0 && alerts.bottom <= vh &&
                   grid.bottom <= vh && hols.bottom <= vh - 6;   // 留 6px 呼吸
      if(!fits) console.log('  假期页超出视口：提醒底 ' + Math.round(alerts.bottom) +
        ' / 日历底 ' + Math.round(grid.bottom) + ' / 放假安排底 ' + Math.round(hols.bottom) + ' vs 视口 ' + vh);
      dw.go('feed');
      return fits;
    })());
    ok('★ 1280px：假期页提醒是一行内联（不占多行高度）', (() => {
      dw.go('calendar');
      const items = [...dd.querySelectorAll('#calAlerts .cal-alert')];
      const rows = new Set(items.map(e => Math.round(e.getBoundingClientRect().top)));
      const single = rows.size === 1 && items.every(e => e.getBoundingClientRect().height <= 32);
      dw.go('feed');
      return single;
    })());

    /* ============ D. 弹窗：位置一律居中，尺寸/布局分端 ============ */
    document.querySelector('#filterBtn').click();
    await sleep(200);
    const sheetM = document.querySelector('#sheetForm');
    const rM = sheetM.getBoundingClientRect();
    const vhM = document.documentElement.clientHeight, vwM = document.documentElement.clientWidth;
    ok('窄屏：弹窗垂直居中', Math.abs((rM.top + rM.bottom) / 2 - vhM / 2) < 24);
    ok('窄屏：弹窗水平居中', Math.abs((rM.left + rM.right) / 2 - vwM / 2) < 24);
    ok('窄屏：★ 不再吸附底部', rM.bottom < vhM - 20);
    ok('窄屏：四角统一圆角（弹窗而非抽屉）', (() => {
      const cs = getComputedStyle(sheetM);
      return parseFloat(cs.borderTopLeftRadius) === parseFloat(cs.borderBottomLeftRadius) &&
             parseFloat(cs.borderTopLeftRadius) >= 12;
    })());
    ok('窄屏：两侧留白、不顶边', rM.left >= 8 && rM.right <= vwM - 8);
    ok('窄屏：高度不超过 84vh', rM.height <= vhM * 0.84 + 1);
    document.querySelector('#sheetForm [data-act="close"]').click();
    await sleep(150);

    dd.querySelector('#filterBtn').click();
    await sleep(250);
    const sheetD = dd.querySelector('#sheetForm');
    const rD = sheetD.getBoundingClientRect();
    const vhD = dd.documentElement.clientHeight, vwD = dd.documentElement.clientWidth;
    ok('1280px：弹窗垂直居中', Math.abs((rD.top + rD.bottom) / 2 - vhD / 2) < 24);
    ok('1280px：弹窗水平居中', Math.abs((rD.left + rD.right) / 2 - vwD / 2) < 24);
    ok('1280px：★ 不吸附底部', rD.bottom < vhD - 40 && rD.top > 40);
    ok('1280px：四角统一圆角（弹窗样式）', (() => {
      const cs = dw.getComputedStyle(sheetD);
      return parseFloat(cs.borderTopLeftRadius) === parseFloat(cs.borderBottomLeftRadius) &&
             parseFloat(cs.borderTopLeftRadius) >= 12;
    })());
    ok('1280px：分端生效 —— 表单弹窗定宽 600px', Math.abs(rD.width - 600) < 2);
    ok('1280px：分端生效 —— 桌面内距更大', parseFloat(dw.getComputedStyle(dd.querySelector('#sheetForm .sheet-head')).paddingLeft) >= 20);
    ok('1280px：弹窗内已无拖拽把手（居中弹窗不需要）', sheetD.querySelector('.grab') === null);
    dd.querySelector('#sheetForm [data-act="close"]').click();
    await sleep(150);

    const idD = dd.querySelector('#feed .note').dataset.id;
    dw.openDetail(idD);
    await sleep(250);
    const rd = dd.querySelector('#sheetDetail').getBoundingClientRect();
    ok('1280px：详情弹窗居中', Math.abs((rd.top + rd.bottom) / 2 - vhD / 2) < 24);
    ok(`1280px：分端生效 —— 详情弹窗加宽到 880px（实测 ${Math.round(rd.width)}）`, Math.abs(rd.width - 880) < 2);
    ok('1280px：★ 详情为左图右文两栏', dw.getComputedStyle(dd.querySelector('#sheetDetail .dwrap')).display === 'flex');
    dw.openSheet(null);
    await sleep(150);

    const idM = md.querySelector('#feed .note').dataset.id;
    mw.openDetail(idM);
    await sleep(250);
    const rdM = md.querySelector('#sheetDetail').getBoundingClientRect();
    const vhM2 = md.documentElement.clientHeight, vwM2 = md.documentElement.clientWidth;
    ok('375px：详情弹窗垂直居中', Math.abs((rdM.top + rdM.bottom) / 2 - vhM2 / 2) < 24);
    ok(`375px：分端生效 —— 手机铺满宽度（实测 ${Math.round(rdM.width)} / 视口 ${vwM2}）`, Math.abs(rdM.width - (vwM2 - 24)) < 2);
    ok('375px：★ 详情为单列（图片在上）', mw.getComputedStyle(md.querySelector('#sheetDetail .dwrap')).display === 'block');
    mw.openSheet(null);
  }catch(e){
    R.push('FAIL :: 运行异常 ' + (e && e.message));
  }
  const fails = R.filter(r => r.startsWith('FAIL'));
  document.querySelector('#TESTOUT').textContent = 'TESTS ' + (R.length - fails.length) + '/' + R.length + ' PASSED\n' + R.join('\n');
  document.title = fails.length ? ('TESTS FAILED: ' + fails.length) : 'TESTS OK';
})();
</script>
