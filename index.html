<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>周末探索 · 周末城市探索指南</title>
<meta name="description" content="按偏好、天气、预算推荐本地周末活动，支持组队出发、打卡记录、攻略分享，多设备实时同步。" />
<meta name="theme-color" content="#FF2B4E" />
<style>
  :root{
    --bg:#F4F1ED; --surface:#FFFFFF; --surface-2:#FBF7F3; --surface-3:#F2EDE7;
    --text:#1B1512; --muted:#8C8178; --line:rgba(27,21,18,.09);
    --accent:#FF2B4E; --accent-2:#FF6B3D; --accent-soft:#FFE8EC;
    --amber:#E4831B; --amber-soft:#FFF1DC;
    --olive:#5F8F49; --olive-soft:#EDF5E6;
    --shadow:0 4px 16px rgba(90,50,25,.08);
    --shadow-lg:0 16px 44px rgba(90,50,25,.20);
    --r:16px;
  }
  html[data-theme=dark]{
    --bg:#15100E; --surface:#1F1815; --surface-2:#271E1A; --surface-3:#2E241F;
    --text:#F7EFE9; --muted:#A2938A; --line:rgba(255,240,232,.10);
    --accent:#FF4D6A; --accent-2:#FF8551; --accent-soft:rgba(255,77,106,.16);
    --amber:#FFAE4D; --amber-soft:rgba(255,174,77,.15);
    --olive:#9CC47A; --olive-soft:rgba(156,196,122,.15);
    --shadow:0 4px 16px rgba(0,0,0,.42);
    --shadow-lg:0 16px 44px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{border:none;background:none;cursor:pointer}
  input,textarea,select{outline:none}
  ::placeholder{color:var(--muted);opacity:.85}
  .wrap{max-width:1080px;margin:0 auto}
  [hidden]{display:none !important}

  /* ================= 顶部栏 ================= */
  .topbar{
    position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--surface) 88%,transparent);
    backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:9px 12px}
  .logo{display:flex;align-items:center;gap:7px;font-weight:900;font-size:15px;letter-spacing:.2px;white-space:nowrap}
  .logo i{
    width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-style:normal;font-size:15px;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));box-shadow:0 4px 12px rgba(255,43,78,.32)
  }
  .search{
    flex:1;display:flex;align-items:center;gap:7px;background:var(--surface-3);border-radius:999px;
    padding:8px 14px;min-width:0;transition:.18s;border:1px solid transparent;
  }
  .search:focus-within{border-color:var(--accent);background:var(--surface)}
  .search input{border:none;background:none;width:100%;font-size:13.5px}
  .icon-btn{
    width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;
    background:var(--surface-3);transition:.18s;flex:0 0 auto;position:relative
  }
  .icon-btn:active{transform:scale(.92)}
  .icon-btn .badge{
    position:absolute;top:-2px;right:-2px;min-width:15px;height:15px;border-radius:99px;font-size:9.5px;
    display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;padding:0 3px
  }

  /* ================= 分类条 ================= */
  .catbar{
    position:sticky;top:52px;z-index:35;background:color-mix(in srgb,var(--surface) 88%,transparent);
    backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);
  }
  .catbar-in{max-width:1080px;margin:0 auto;display:flex;gap:16px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
  .catbar-in::-webkit-scrollbar{display:none}
  .cat{
    position:relative;padding:11px 1px 10px;font-size:14px;color:var(--muted);white-space:nowrap;font-weight:600;transition:.18s
  }
  .cat.on{color:var(--text);font-weight:800;font-size:14.5px}
  .cat.on::after{
    content:"";position:absolute;left:50%;bottom:4px;transform:translateX(-50%);width:18px;height:3px;
    border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-2))
  }

  /* ================= 天气条 ================= */
  .weatherbar{
    display:flex;align-items:center;gap:9px;margin:10px 12px 2px;padding:9px 13px;border-radius:14px;
    background:linear-gradient(120deg,var(--amber-soft),var(--accent-soft));border:1px solid var(--line);
    font-size:12.5px;line-height:1.45
  }
  .weatherbar b{font-weight:800}
  .weatherbar .wtag{margin-left:auto;font-size:11px;color:var(--muted);white-space:nowrap}

  /* ================= 工具行 ================= */
  .toolrow{display:flex;align-items:center;gap:8px;padding:10px 12px 4px;flex-wrap:wrap}
  .toolrow .count{font-size:12px;color:var(--muted);margin-right:auto}
  .pill{
    display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
    background:var(--surface);border:1px solid var(--line);transition:.16s;white-space:nowrap
  }
  .pill:active{transform:scale(.95)}
  .pill.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}

  /* ================= 瀑布流 ================= */
  .masonry{display:flex;gap:10px;padding:10px 12px 110px;align-items:flex-start}
  .mcol{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .note{
    background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);
    border:1px solid var(--line);opacity:0;transform:translateY(14px);transition:opacity .45s,transform .45s;
    position:relative
  }
  .note.in{opacity:1;transform:none}
  .note:active{transform:scale(.985)}
  .cover{position:relative;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .cover .emo{font-size:52px;filter:drop-shadow(0 6px 14px rgba(120,60,30,.25));z-index:2}
  .cover .grain{
    position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,.55) 0 2px,transparent 3px),
                     radial-gradient(circle at 75% 70%,rgba(255,255,255,.4) 0 2px,transparent 3px);
    background-size:34px 34px,52px 52px
  }
  .cover .rings{position:absolute;inset:-30% -10% auto auto;width:150px;height:150px;border-radius:50%;
    border:14px solid rgba(255,255,255,.28)}
  .cover .price{
    position:absolute;left:8px;bottom:8px;z-index:3;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;
    background:rgba(27,21,18,.62);color:#FFF6F1;backdrop-filter:blur(6px)
  }
  .cover .price.free{background:rgba(95,143,73,.92)}
  .cover .match{
    position:absolute;right:8px;top:8px;z-index:3;font-size:11px;font-weight:900;padding:3px 8px;border-radius:99px;
    background:rgba(255,255,255,.94);color:var(--accent)
  }
  .note-body{padding:9px 10px 10px}
  .note-title{
    font-size:13.5px;font-weight:700;line-height:1.45;margin:0 0 6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  .note-desc{
    font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden
  }
  .hashtags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .hashtags span{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:6px}
  .hashtags span.g{color:var(--olive);background:var(--olive-soft)}
  .note-foot{display:flex;align-items:center;gap:6px}
  .avatar{
    width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;
    background:var(--surface-3);flex:0 0 auto
  }
  .nick{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .like{display:flex;align-items:center;gap:3px;font-size:11.5px;color:var(--muted);font-weight:700;flex:0 0 auto}
  .like .ico{font-size:13px;display:inline-block}
  .like.on{color:var(--accent)}
  .like.on .ico{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.6)}100%{transform:scale(1)}}

  /* 双击点赞的心 */
  .burst{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.3);font-size:110px;z-index:200;
    pointer-events:none;opacity:0
  }
  .burst.go{animation:burst .8s ease-out}
  @keyframes burst{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    70%{opacity:1;transform:translate(-50%,-90%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-130%) scale(.9)}
  }

  /* 骨架屏 */
  .sk{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
  .sk .a{height:150px;background:var(--surface-3);animation:sh 1.2s infinite}
  .sk .b{height:11px;margin:10px;border-radius:6px;background:var(--surface-3);animation:sh 1.2s infinite .1s}
  .sk .c{height:11px;margin:10px;width:60%;border-radius:6px;background:var(--surface-3);animation:sh 1.2s infinite .2s}
  @keyframes sh{0%,100%{opacity:.55}50%{opacity:1}}

  /* ================= 列表页通用 ================= */
  .page{padding:12px 12px 108px}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;margin:6px 2px 10px}
  .sec-title small{font-weight:600;color:var(--muted);font-size:11.5px;margin-left:auto}
  .list{display:grid;gap:10px}
  .row-card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(12px);transition:.4s
  }
  .row-card.in{opacity:1;transform:none}
  .row-card .rt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .row-card h3{margin:0;font-size:14.5px;line-height:1.4}
  .row-card .meta{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.6}
  .ring{
    flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;
    background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-3) 0);position:relative
  }
  .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
  .ring span{position:relative;z-index:1;font-size:11.5px}
  .ring.mine{background:conic-gradient(var(--amber) calc(var(--p)*1%),var(--surface-3) 0)}
  .bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--amber))}
  .faces{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}
  .faces span{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
  .faces span.me{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .btn{
    padding:8px 14px;border-radius:11px;font-size:12.5px;font-weight:700;background:var(--surface-3);color:var(--text);
    transition:.16s;display:inline-flex;align-items:center;gap:5px;justify-content:center
  }
  .btn:active{transform:scale(.96)}
  .btn.pri{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 16px rgba(255,43,78,.28)}
  .btn.line{border:1px solid var(--line);background:transparent}
  .btn.warn{color:var(--accent);background:var(--accent-soft)}
  .btn.block{width:100%;padding:12px;border-radius:13px;font-size:14px}
  .btn[disabled]{opacity:.45;box-shadow:none}
  .empty{
    text-align:center;color:var(--muted);font-size:12.5px;line-height:1.8;padding:44px 16px;
  }
  .empty .big{font-size:44px;display:block;margin-bottom:10px;opacity:.9}

  /* 时间线 */
  .tl{position:relative;padding-left:16px;border-left:2px solid var(--line);margin-left:5px}
  .tl::before{
    content:"";position:absolute;left:-6px;top:5px;width:10px;height:10px;border-radius:50%;
    background:linear-gradient(140deg,var(--accent),var(--amber));box-shadow:0 0 0 3px var(--surface)
  }
  .tl + .tl{margin-top:14px}
  .tl h4{margin:0;font-size:14px}
  .tl .meta{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.6}
  .tl .quote{font-size:12.5px;margin-top:6px;padding:8px 10px;border-radius:10px;background:var(--surface-2);line-height:1.6}

  /* 统计 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;box-shadow:var(--shadow)}
  .stat b{display:block;font-size:17px;line-height:1.2}
  .stat span{font-size:10.5px;color:var(--muted)}
  @media(max-width:360px){.stat b{font-size:15px}}

  .field{margin-bottom:13px}
  .field>label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px}
  select,input[type=text],input[type=number],input[type=date],textarea{
    width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);
    font-size:13.5px;transition:.15s
  }
  select:focus,input:focus,textarea:focus{border-color:var(--accent);background:var(--surface)}
  textarea{resize:vertical;min-height:84px;line-height:1.6}
  input[type=range]{width:100%;accent-color:var(--accent);height:22px}
  .two-col{display:flex;gap:10px}
  .two-col>*{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:7px 13px;border-radius:999px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--line);
    transition:.16s;user-select:none;font-weight:600
  }
  .chip:active{transform:scale(.95)}
  .chip.on{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#fff;border-color:transparent;font-weight:800}
  .hintline{font-size:11.5px;color:var(--muted);line-height:1.7}

  /* ================= 底部 Tab ================= */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(16px);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
  }
  .tabbar-in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:56px}
  .tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:100%;color:var(--muted);transition:.16s}
  .tb i{font-style:normal;font-size:19px;line-height:1}
  .tb span{font-size:10px;font-weight:700}
  .tb.on{color:var(--accent)}
  .tb.on i{animation:pop .45s}
  .tb.plus{position:relative}
  .tb.plus .pl{
    position:absolute;top:-16px;width:50px;height:40px;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;font-size:26px;font-weight:300;
    box-shadow:0 8px 20px rgba(255,43,78,.4);transition:.18s
  }
  .tb.plus:active .pl{transform:scale(.92)}
  .tb.plus span{margin-top:26px}

  /* ================= 弹层 ================= */
  .mask{
    position:fixed;inset:0;background:rgba(30,15,8,.45);backdrop-filter:blur(3px);z-index:70;opacity:0;
    transition:.25s;pointer-events:none
  }
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:80;max-width:620px;margin:0 auto;
    background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);
    transform:translateY(102%);transition:transform .3s cubic-bezier(.3,1,.4,1);
    max-height:88vh;display:flex;flex-direction:column
  }
  .sheet.on{transform:none}
  .sheet-head{
    position:relative;padding:16px 18px 10px;border-bottom:1px solid var(--line);flex:0 0 auto
  }
  .sheet-head h3{margin:0;font-size:15.5px;font-weight:800}
  .sheet-head p{margin:5px 0 0;font-size:11.5px;color:var(--muted);line-height:1.6}
  .sheet-head .x{
    position:absolute;right:14px;top:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:var(--surface-3);font-size:15px;color:var(--muted)
  }
  .sheet-body{padding:14px 18px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
  .grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}

  /* 详情页封面 */
  .dcover{height:170px;border-radius:14px;position:relative;display:grid;place-items:center;overflow:hidden;margin-bottom:12px}
  .dcover .emo{font-size:74px;z-index:2;filter:drop-shadow(0 8px 18px rgba(120,60,30,.28))}
  .dcover .price{left:12px;bottom:12px;font-size:13px;padding:5px 12px}
  .dcover .match{right:12px;top:12px;font-size:12.5px;padding:5px 11px}
  .dtitle{font-size:18px;font-weight:800;line-height:1.4;margin:0 0 8px}
  .dmeta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .dmeta span{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);padding:4px 10px;border-radius:99px}
  .dsec{margin:16px 0 0}
  .dsec h4{margin:0 0 8px;font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px}
  .why{display:flex;flex-wrap:wrap;gap:6px}
  .why b{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--olive-soft);color:var(--olive)}
  .why b.w{background:var(--amber-soft);color:var(--amber)}
  .dbody{font-size:13px;line-height:1.75;color:var(--muted);white-space:pre-wrap}
  .planbox{background:var(--surface-2);border-radius:13px;padding:12px 14px;font-size:12.5px;line-height:1.8}
  .planbox b{color:var(--accent)}
  .actionbar{
    display:flex;gap:8px;position:sticky;bottom:0;background:var(--surface);padding-top:12px;margin-top:14px;
    border-top:1px solid var(--line)
  }
  .actionbar .btn{flex:1}

  /* 发布选择 */
  .pubgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .pubgrid button{
    background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;transition:.16s
  }
  .pubgrid button:active{transform:scale(.95)}
  .pubgrid i{font-style:normal;font-size:24px;display:block;margin-bottom:6px}
  .pubgrid b{font-size:11.5px;font-weight:700}
  .segmented{display:flex;gap:6px;background:var(--surface-2);padding:4px;border-radius:12px;margin-bottom:13px}
  .segmented button{flex:1;padding:8px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);transition:.16s}
  .segmented button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

  /* 同步状态 */
  .syncbox{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:13px}
  .syncrow{display:flex;align-items:center;gap:9px;font-size:12.5px}
  .syncrow .led{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
  .syncrow .led.on{background:var(--olive);box-shadow:0 0 0 4px var(--olive-soft);animation:blink 2s infinite}
  .syncrow .led.wait{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.45}}
  .roomcode{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:900;letter-spacing:5px;
    text-align:center;padding:12px;border-radius:13px;background:var(--accent-soft);color:var(--accent);margin:10px 0
  }
  .kv{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:5px 0}
  .kv b{color:var(--text);font-weight:700}

  /* toast */
  #toast{
    position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);opacity:0;pointer-events:none;z-index:300;

<script>
/* =========================================================
   周末探索 v2 —— 小红书式交互 + 跨设备同步
   模块：[工具] [数据] [天气/推荐引擎] [封面] [信息流] [弹层]
        [组队] [打卡] [攻略] [我的] [云同步]
   ========================================================= */

/* ---------------- 0. 工具 ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const buzz = (ms = 12) => { try { navigator.vibrate?.(ms); } catch {} };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const LOGIN_EMOJI = ['🙂','🐱','🐼','🦊','🐨','🐧','🦉','🐳','🌵','🍑','🥑','🍊'];
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 1800);
}

/* ---------------- 1. 数据层 ---------------- */
const LS = { store:'wcg.store.v2', prefs:'wcg.prefs.v2', me:'wcg.me.v2', theme:'wcg.theme.v2' };
let store = load(LS.store, { teams:[], checkins:[], guides:[], activities:[], likes:{}, tomb:[] });
store.teams ||= []; store.checkins ||= []; store.guides ||= [];
store.activities ||= []; store.likes ||= {}; store.tomb ||= [];
let me = load(LS.me, { nick:'', emoji:'🙂', room:'', joined:0 });
const persistStore = () => save(LS.store, store);

// 兼容 v1 数据
(function migrate(){
  if(localStorage.getItem(LS.store)) return;
  const t = load('wcg.teams.v1', []), c = load('wcg.checkins.v1', []), g = load('wcg.guides.v1', []);
  if(!t.length && !c.length && !g.length) return;
  store.teams = t; store.checkins = c;
  store.guides = g.map(x => ({ ...x, likedBy: Array(Math.max(0, x.likes|0)).fill('旧数据') }));
  persistStore();
})();

const DEFAULT_PREFS = { city:'上海', day:1, budget:150, people:3, hours:4, types:[], extras:[], plat:'展板' };
let prefs = Object.assign({}, DEFAULT_PREFS, load(LS.prefs, {}));
if(!localStorage.getItem(LS.prefs)) prefs.day = new Date().getDay() === 0 ? 2 : 1;
const persistPrefs = () => save(LS.prefs, prefs);
const persistMe = () => save(LS.me, me);
const myNick = () => me.nick || '我';

/* ---------------- 2. 城市 / 活动 / 天气 ---------------- */
const CITIES = {
  '北京':{lat:39.9042,lon:116.4074}, '上海':{lat:31.2304,lon:121.4737},
  '广州':{lat:23.1291,lon:113.2644}, '深圳':{lat:22.5431,lon:114.0579},
  '成都':{lat:30.5728,lon:104.0668}, '杭州':{lat:30.2741,lon:120.1551},
  '武汉':{lat:30.5928,lon:114.3055}, '西安':{lat:34.3416,lon:108.9398}
};
const BUILTIN = [
  { id:'a1',  name:'市立美术馆 · 当代艺术特展', type:'展览', price:60,  hours:2.5, dist:4.2, min:1, max:6,  indoor:true,  tags:['出片','冷气','文艺'], desc:'两层展厅 + 露台咖啡，凭学生证半价，周末需提前预约。' },
  { id:'a2',  name:'老城区周末创意市集',       type:'市集', price:0,   hours:2,   dist:3.1, min:1, max:8,  indoor:false, tags:['免费','小吃','淘货'], desc:'手作摊、独立唱片、二手书，边逛边吃，人多但不挤。' },
  { id:'a3',  name:'Livehouse 独立乐队现场',   type:'演出', price:120, hours:3,   dist:5.6, min:1, max:6,  indoor:true,  tags:['夜生活','乐队','出片'], desc:'小场地近距离，站票为主，记得带耳塞和现金。' },
  { id:'a4',  name:'城郊云顶步道短途徒步',     type:'徒步', price:20,  hours:5,   dist:18,  min:2, max:8,  indoor:false, tags:['爬山','体能','出片'], desc:'海拔爬升 400m，山顶视野开阔，建议 9 点前上山。' },
  { id:'a5',  name:'桌游主题咖啡馆',           type:'桌游', price:45,  hours:3,   dist:1.8, min:3, max:8,  indoor:true,  tags:['破冰','新手友好','雨天友好'], desc:'店内有主持 DM，人均 45 含一杯饮品，4 人以上最好提前订位。' },
  { id:'a6',  name:'江畔日落夜骑',             type:'夜骑', price:0,   hours:1.5, dist:2.4, min:1, max:6,  indoor:false, tags:['免费','运动','出片'], desc:'共享单车即可，全程平路 12km，日落前后最美。' },
  { id:'a7',  name:'陶艺手作体验课',           type:'手作', price:150, hours:2,   dist:3.6, min:1, max:4,  indoor:true,  tags:['手作','纪念品','安静'], desc:'拉坯 + 上釉，作品两周后自取或邮寄，很适合留纪念。' },
  { id:'a8',  name:'城市公园野餐 + 飞盘局',     type:'露营', price:0,   hours:3,   dist:6.5, min:4, max:12, indoor:false, tags:['免费','团建','晒太阳'], desc:'大草坪 + 树荫，4 人以上就能玩起来，自带垫子和水。' },
  { id:'a9',  name:'老书店 + 独立咖啡漫游',     type:'咖啡', price:40,  hours:2,   dist:2.2, min:1, max:3,  indoor:true,  tags:['安静','自习','慢生活'], desc:'两家老书店 + 一家手冲，适合一个人放空或两三人聊天。' },
  { id:'a10', name:'街头摄影 Citywalk',        type:'摄影', price:0,   hours:3,   dist:4.8, min:1, max:6,  indoor:false, tags:['免费','出片','走路'], desc:'老巷 → 骑楼 → 天桥 → 江边，黄金时段 16:30 出发。' },
  { id:'a11', name:'沉浸式小剧场演出',         type:'演出', price:180, hours:2.5, dist:7.2, min:2, max:4,  indoor:true,  tags:['文艺','约会','出片'], desc:'观众跟随演员移动，建议提前 20 分钟到场存包。' },
  { id:'a12', name:'露天音乐喷泉夜场',         type:'演出', price:0,   hours:1.5, dist:5.1, min:1, max:10, indoor:false, tags:['免费','夜景','亲子'], desc:'每晚 19:30 一场，提前 15 分钟占前排位置。' },
  { id:'a13', name:'近郊观星 + 天幕露营',      type:'露营', price:90,  hours:4,   dist:22,  min:2, max:8,  indoor:false, tags:['夜间','星空','近郊'], desc:'需自驾或拼车，带上防潮垫与红光手电筒。' },
  { id:'a14', name:'复古胶片冲洗工作坊',       type:'手作', price:80,  hours:2,   dist:3.3, min:1, max:4,  indoor:true,  tags:['小众','手作','安静'], desc:'自带一卷未冲洗胶卷，现场学会显影和扫描。' },
  { id:'a15', name:'VR / 电竞体验馆开黑',      type:'桌游', price:70,  hours:2,   dist:2.9, min:2, max:6,  indoor:true,  tags:['雨天友好','开黑','新手友好'], desc:'按小时计费，4 人联机最划算，周末晚场需排队。' },
  { id:'a16', name:'早市 + 城市早餐地图',      type:'市集', price:25,  hours:1.5, dist:1.5, min:1, max:4,  indoor:false, tags:['早起','美食','免费'], desc:'8 点前最热闹，一条街吃四样，人均不超过 30。' }
];
const TYPES = ['展览','市集','演出','徒步','桌游','咖啡','夜骑','手作','露营','摄影'];
const TYPE_EMOJI = { '展览':'🖼️','市集':'🧺','演出':'🎤','徒步':'⛰️','桌游':'🎲','咖啡':'☕','夜骑':'🚲','手作':'🏺','露营':'⛺','摄影':'📷' };
const activityLib = () => BUILTIN.concat(store.activities || []);
const findAct = id => activityLib().find(a => a.id === id);

const WMO = {
  0:['晴','☀️',true],1:['大致晴朗','🌤️',true],2:['多云','⛅',true],3:['阴','☁️',true],
  45:['有雾','🌫️',false],48:['雾凇','🌫️',false],51:['小毛毛雨','🌦️',false],53:['毛毛雨','🌦️',false],55:['浓毛毛雨','🌧️',false],
  61:['小雨','🌧️',false],63:['中雨','🌧️',false],65:['大雨','⛈️',false],66:['冻雨','🌧️',false],67:['强冻雨','🌧️',false],
  71:['小雪','🌨️',false],73:['中雪','🌨️',false],75:['大雪','❄️',false],77:['米雪','🌨️',false],
  80:['阵雨','🌦️',false],81:['强阵雨','🌧️',false],82:['暴雨','⛈️',false],85:['阵雪','🌨️',false],86:['强阵雪','❄️',false],
  95:['雷阵雨','⛈️',false],96:['雷阵雨伴冰雹','⛈️',false],99:['强雷暴','⛈️',false]
};
let weather = null;
function weekendOffset(which){ const dow = new Date().getDay(); return ((which===1?6:0) - dow + 7) % 7; }
const targetIdx = () => Math.min(weekendOffset(prefs.day), (weather?.days.length ?? 1) - 1);
const targetWeather = () => weather ? weather.days[targetIdx()] : null;
const isWet = w => !!w && (w.pop >= 50 || (!w.ok && w.pop >= 25));
const MOCK_W = [[2,22,14,10],[0,25,16,0],[61,19,13,75],[1,24,15,5],[80,21,15,60],[3,20,14,30],[0,26,17,0]];
function mockWeather(){
  const t = new Date();
  return { live:false, days: MOCK_W.map((m,i)=>{
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i), w = WMO[m[0]] || WMO[2];
    return { date:ymd(d), code:m[0], label:w[0], emoji:w[1], ok:w[2], tmax:m[1], tmin:m[2], pop:m[3] };
  })};
}
async function fetchWeather(city){
  const c = CITIES[city]; if(!c) return mockWeather();
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 6000);
  try{
    const res = await fetch(url, { signal: ctrl.signal }); if(!res.ok) throw new Error('http ' + res.status);
    const d = (await res.json()).daily;
    return { live:true, days: d.time.map((t,i)=>{
      const code = d.weather_code[i], w = WMO[code] || WMO[2];
      return { date:t, code, label:w[0], emoji:w[1], ok:w[2], tmax:Math.round(d.temperature_2m_max[i]),
               tmin:Math.round(d.temperature_2m_min[i]), pop: d.precipitation_probability_max?.[i] ?? 0 };
    })};
  }catch{ return mockWeather(); } finally{ clearTimeout(timer); }
}

/* ---------------- 3. 推荐引擎（可解释加权评分） ---------------- */
function scoreActivity(a, w){
  let s = 30; const reasons = [], warns = [];
  const rainy = isWet(w);
  if(prefs.types.length){
    if(prefs.types.includes(a.type)){ s += 26; reasons.push(`命中偏好 · ${a.type}`); } else { s -= 18; }
  }
  if(a.indoor){
    if(rainy){ s += 18; reasons.push('下雨天室内更稳'); }
  } else if(rainy){
    s -= 32; warns.push(w ? `${w.label} ${w.pop}% 降水，户外有风险` : '天气可能不佳');
  } else {
    s += 16;
    if(w && w.tmax >= 18 && w.tmax <= 28){ s += 6; reasons.push(`天气刚好 · ${w.tmax}°C`); } else { reasons.push('天气适合户外'); }
  }
  if(a.price <= prefs.budget){
    s += 18 - Math.min(10, Math.round(a.price / Math.max(1, prefs.budget) * 10));
    reasons.push(a.price === 0 ? '完全免费' : `¥${a.price} 在预算内`);
  } else {
    const over = a.price - prefs.budget;
    s -= Math.min(30, 12 + over / 5); warns.push(`超预算 ¥${over}`);
  }
  if(prefs.people >= a.min && prefs.people <= a.max){ s += 15; reasons.push(`${prefs.people} 人正合适`); }
  else if(prefs.people < a.min){ s -= 12; warns.push(`至少 ${a.min} 人`); }
  else { s -= 8; warns.push(`更适合 ${a.max} 人以内`); }
  const lim = prefs.hours === 9 ? 12 : prefs.hours;
  if(a.hours <= lim){ s += 12; if(lim - a.hours >= 0.5) reasons.push(`约 ${a.hours}h，来得及`); }
  else { s -= 16; warns.push(`约需 ${a.hours}h，时间偏紧`); }
  const near = prefs.extras.includes('near');
  if(a.dist <= 3){ s += near ? 16 : 8; reasons.push(`离家 ${a.dist}km`); }
  else if(a.dist >= 15){ s -= near ? 22 : 8; if(near) warns.push(`较远 ${a.dist}km`); }
  if(prefs.extras.includes('cheap')){ if(a.price <= 40){ s += 10; reasons.push('花费很低'); } else s -= 8; }
  if(prefs.extras.includes('photo') && a.tags.includes('出片')){ s += 10; reasons.push('很出片'); }
  if(prefs.extras.includes('newbie') && a.tags.includes('新手友好')){ s += 10; reasons.push('新手友好'); }
  return { score: Math.max(6, Math.min(99, Math.round(s))), reasons: reasons.slice(0,4), warns: warns.slice(0,2) };
}
function planTime(a){
  const start = prefs.day === 1 ? '周六' : '周日';
  let h = 14;
  if(a.type === '市集' && a.hours <= 2) h = 10;
  if(a.type === '徒步' || a.type === '露营') h = 9;
  if(a.type === '夜骑') h = 18;
  if(a.type === '演出') h = 19.5;
  const f = t => `${String(Math.floor(t)).padStart(2,'0')}:${t % 1 ? '30' : '00'}`;
  return `${start} ${f(h)}-${f(h + a.hours)}`;
}

/* ---------------- 4. 封面（纯 CSS 暖色，零外链） ---------------- */
const GRADS = [
  ['#FFD9A8','#FF8B5E'], ['#FFDCE3','#FF7A93'], ['#FFEFC4','#F5B942'], ['#E7F0DA','#8FB863'],
  ['#F6E2D3','#C98A5E'], ['#FFE2D1','#FF9E7A'], ['#FBD9C4','#DE7048'], ['#EDE4D8','#B99C7A'],
  ['#FFE9B8','#E9A93B'], ['#E5EFE0','#7BA377'], ['#FADFCF','#D97757'], ['#F2E6D8','#BF9E80'],
  ['#FFDBDE','#E8697B'], ['#FFF2D4','#E0AC46'], ['#E8EFE1','#87A465'], ['#FFE5E0','#D9705F']
];
const PATTERNS = ['grain','rings','none'];
const hash = s => { let h = 0; for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
let gradSeed = 0;
function coverHTML(a, h, extra){
  const k = hash(a.id + a.name), g = GRADS[(k + gradSeed) % GRADS.length], pat = PATTERNS[k % 3];
  const emo = TYPE_EMOJI[a.type] || '🎈';
  return `<div class="cover" style="height:${h}px;background:linear-gradient(135deg,${g[0]},${g[1]})">
    ${pat === 'rings' ? '<div class="rings"></div>' : ''}
    ${pat === 'grain' ? '<div class="grain"></div>' : ''}
    <span class="emo">${emo}</span>
    <span class="price ${a.price === 0 ? 'free' : ''}">${a.price === 0 ? '免费' : '¥' + a.price}</span>
    ${extra || ''}
  </div>`;
}
const coverHeights = [150, 190, 130, 170, 145, 205];

/* ---------------- 5. 信息流 ---------------- */
let cat = '全部', keyword = '';
function visibleActivities(){
  const w = targetWeather();
  return activityLib().map(a => ({ a, ...scoreActivity(a, w) }))
    .filter(x => (cat === '全部' || x.a.type === cat))
    .filter(x => {
      if(!keyword) return true;
      const k = keyword.toLowerCase();
      return (x.a.name + x.a.desc + x.a.type + x.a.tags.join(' ')).toLowerCase().includes(k);
    })
    .sort((x, y) => y.score - x.score);
}
/* 点赞：store.likes[活动id][昵称] = 时间戳（正=已赞，负=取消赞），
   合并时同一昵称取时间戳绝对值更大的一条 —— 每人最后一次操作生效，无需墓碑 */
const likeMap = id => store.likes[id] || {};
const likeList = id => Object.entries(likeMap(id)).filter(([, v]) => v > 0).map(([n]) => n);
const likeCount = id => likeList(id).length;
const iLiked = id => (likeMap(id)[myNick()] || 0) > 0;

function renderFeed(){
  const feed = $('#feed');
  if(!weather){ feed.innerHTML = skeleton(); return; }
  const list = visibleActivities();
  const w = targetWeather();
  const shown = list.slice(0, 24);
  $('#feedCount').textContent = `${prefs.city} · ${prefs.day === 1 ? '周六' : '周日'} · ${shown.length} 个推荐`;
  if(!shown.length){
    feed.innerHTML = `<div class="empty" style="flex:1"><span class="big">🔍</span>没有匹配的活动<br>换个关键词或放宽筛选条件试试</div>`;
    return;
  }
  const cols = window.innerWidth >= 760 ? 3 : 2;
  const buckets = Array.from({ length: cols }, () => []);
  shown.forEach((x, i) => buckets[i % cols].push(cardHTML(x, i)));
  feed.innerHTML = buckets.map(b => `<div class="mcol">${b.join('')}</div>`).join('');
  observeIn();
  function cardHTML(x, i){
    const a = x.a, liked = iLiked(a.id), h = coverHeights[hash(a.id) % coverHeights.length];
    const tags = a.tags.slice(0, 3).map((t, j) => `<span class="${j === 1 ? 'g' : ''}">#${esc(t)}</span>`).join('');
    return `<article class="note" data-id="${a.id}">
      <div class="cover-wrap" data-tap="detail" data-id="${a.id}">
        ${coverHTML(a, h, `<span class="match">${x.score}% 匹配</span>`)}
      </div>
      <div class="note-body">
        <h3 class="note-title">${esc(a.name)}</h3>
        <p class="note-desc">${esc(a.desc)}</p>
        <div class="hashtags">${tags}</div>
        <div class="note-foot">
          <span class="avatar">${me.emoji}</span>
          <span class="nick">${esc(prefs.people)} 人 · ${a.hours}h · ${a.dist}km</span>
          <button class="like ${liked ? 'on' : ''}" data-act="like" data-id="${a.id}">
            <span class="ico">${liked ? '❤️' : '🤍'}</span><span class="cnt">${likeCount(a.id)}</span>
          </button>
        </div>
      </div>
    </article>`;
  }
  function skeleton(){
    const sk = `<div class="sk"><div class="a"></div><div class="b"></div><div class="c"></div></div>`;
    return `<div class="mcol">${sk}${sk}</div><div class="mcol">${sk}${sk}</div>`;
  }
}
function observeIn(){
  const io = new IntersectionObserver((es, o) => {
    es.forEach((e, i) => { if(e.isIntersecting){ setTimeout(() => e.target.classList.add('in'), i * 35); o.unobserve(e.target); } });
  }, { rootMargin:'60px' });
  $$('.note:not(.in), .row-card:not(.in)').forEach(el => io.observe(el));
}
function renderWeatherBar(){
  const bar = $('#weatherBar'), w = targetWeather(), idx = targetIdx();
  if(!w){ bar.textContent = '正在获取天气…'; return; }
  const wd = ['周日','周一','周二','周三','周四','周五','周六'][new Date(w.date + 'T00:00:00').getDay()];
  const when = idx === 0 ? '今天' : idx === 1 ? '明天' : `${idx} 天后`;
  const wet = isWet(w);
  const tip = wet ? '☔ 优先室内活动' : (w.tmax >= 30 ? '🥵 避开正午' : (w.tmax <= 8 ? '🧣 注意保暖' : '🌞 户外放心冲'));
  bar.innerHTML = `<span style="font-size:17px">${w.emoji}</span>
    <span><b>${esc(prefs.city)} · ${esc(prefs.day === 1 ? '周六' : '周日')}</b> ${wd} ${w.tmin}~${w.tmax}°C ${esc(w.label)} · ${tip}</span>
    <span class="wtag">${when}${weather.live ? '' : '（示例）'}</span>`;
}

const likeActivity = (id, silent) => {
  const cur = likeMap(id), nick = myNick();
  const liked = (cur[nick] || 0) > 0;
  store.likes[id] = { ...cur, [nick]: liked ? -Date.now() : Date.now() };
  persistStore(); sync.schedule();
  if(!liked){ buzz(14); if(!silent) burstHeart(); }
  return !liked;
};
function burstHeart(){
  const b = $('#burst'); b.classList.remove('go'); void b.offsetWidth; b.classList.add('go');
}

/* ---------------- 15. 云同步（textdb.dev 公共存储 + 分享链接） ---------------- */
const DB = 'https://textdb.dev/api/data';
// 房间码 → 存储 key。textdb 的语义：拿到 key 的人都能读写，正好等价于「房间码即钥匙」
const topicOf = code => 'wcg-' + String(code).toUpperCase();
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({ length:6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const POLL_MS = 6000;          // 轮询间隔：够实时，又不至于把公共服务的请求打爆

const sync = {
  poll:null, status:'off', lastPub:0, peers:{}, pubTimer:null, inflight:false,
  statusText(){
    return { off:'未开启同步', live:'🟢 已连接，自动同步', syncing:'🟡 同步中…', err:'🔴 同步失败（数据仍在本机）' }[this.status] || this.status;
  },
  async join(code){
    code = String(code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if(code.length < 4) return toast('房间码至少 4 位');
    me.room = code; me.joined = Date.now(); persistMe();
    this.status = 'syncing'; renderMe(); renderSyncSheet();
    await this.pull();            // 先拉：如果是已有房间，先把同伴的数据合并进来
    await this.publish(true);     // 再把本机数据并回去
    this.listen();
  },
  leave(){
    this.stopPoll();
    me.room = ''; persistMe(); this.status = 'off'; this.peers = {};
    renderMe(); renderSyncSheet(); toast('已离开房间');
  },
  listen(){
    this.stopPoll(); this.status = 'live';
    this.poll = setInterval(() => { if(!document.hidden) this.pull(); }, POLL_MS);
    renderMe(); renderSyncSheet();
  },
  stopPoll(){ if(this.poll){ clearInterval(this.poll); this.poll = null; } },
  schedule(){ if(!me.room) return; clearTimeout(this.pubTimer); this.pubTimer = setTimeout(() => this.publish(), 600); },
  async publish(force){
    if(!me.room || this.inflight) return;
    this.inflight = true;
    try{
      // 关键：先拉取云端并合并，再做「读-改-写」。
      // 否则后写的客户端会用自己较少的数据整份覆盖，抹掉别人的贡献。
      try{ const remote = await this.fetchRemote(); if(remote) this.receive(remote, true); }catch{}
      const snap = this.snapshot();
      let payload = JSON.stringify(snap);
      if(payload.length > 60000){      // 礼貌上限，超出就丢掉最旧的条目（本机数据不受影响）
        snap.checkins = snap.checkins.slice(0, 8);
        snap.guides = snap.guides.slice(0, 8);
        payload = JSON.stringify(snap);
      }
      const r = await fetch(`${DB}/${topicOf(me.room)}`, {
        method:'POST', body: payload, headers:{ 'Content-Type':'application/json' }
      });
      if(!r.ok) throw new Error('http ' + r.status);
      this.lastPub = Date.now(); this.status = 'live';
      this.peers[me.nick || '我'] = Date.now();
    }catch{ this.status = 'err'; }
    this.inflight = false;
    renderMe(); renderSyncSheet();
  },
  snapshot(){
    return { v:2, room:me.room, nick:me.nick, ts:Date.now(),
      teams:store.teams.slice(0, 20), checkins:store.checkins.slice(0, 20),
      guides:store.guides.map(g => ({ ...g, body:(g.body || '').slice(0, 500) })).slice(0, 20),
      activities:store.activities.slice(0, 12), likes:store.likes, tomb:store.tomb.slice(-150) };
  },
  async fetchRemote(){
    if(!me.room) return null;
    // 注意：这里刻意不发 Accept: application/json —— textdb 的 JSON 模式会把值再包一层
    // JSON 字符串（响应形如 "{\"a\":1}"），导致解析出字符串、合并静默失效。
    const r = await fetch(`${DB}/${topicOf(me.room)}?_=${Date.now()}`);
    if(!r.ok) throw new Error('http ' + r.status);
    const txt = (await r.text()).trim();
    if(!txt) return null;                      // 空 = 房间还没人写过
    let data = JSON.parse(txt);
    if(typeof data === 'string') data = JSON.parse(data);   // 万一被包了一层，再解一次
    return (data && typeof data === 'object') ? data : null;
  },
  async pull(){
    if(!me.room) return;
    try{
      const remote = await this.fetchRemote();
      if(remote) this.receive(remote);
      if(this.status === 'err' || this.status === 'syncing') this.status = 'live';
    }catch{ this.status = 'err'; }
    renderMe(); renderSyncSheet();
  },
  receive(remote, quiet){
    if(!remote || typeof remote !== 'object') return;
    if(remote.room && me.room && remote.room !== me.room) return;   // 房号不符才丢弃
    // 只有对方最近 90 秒内发布过，才算「在线」
    if(remote.nick && (Date.now() - (remote.ts || 0)) < 90000) this.peers[remote.nick] = Date.now();
    // 合并：按 id 并集，同 id 取 ts 较新者；墓碑（删除）优先
    const tomb = new Set([...(store.tomb || []), ...(remote.tomb || [])]);
    ['teams','checkins','guides','activities'].forEach(key => {
      const map = new Map((store[key] || []).map(x => [x.id, x]));
      (remote[key] || []).forEach(r => { const m = map.get(r.id); if(!m || (r.ts || 0) > (m.ts || 0)) map.set(r.id, r); });
      store[key] = [...map.values()].filter(x => !tomb.has(x.id));
    });
    Object.entries(remote.likes || {}).forEach(([id, obj]) => {
      const mine = { ...(store.likes[id] || {}) };
      Object.entries(obj || {}).forEach(([nick, v]) => {
        if(typeof v !== 'number') return;                       // 忽略 v1 的旧数组格式
        if(!mine[nick] || Math.abs(v) > Math.abs(mine[nick])) mine[nick] = v;
      });
      store.likes[id] = mine;
    });
    store.tomb = [...tomb].slice(-150);
    persistStore();
    renderTeams(); renderCheckins(); renderGuides(); renderMe(); if(!quiet) renderFeed();
  },
  online(){ const now = Date.now(); return Object.entries(this.peers).filter(([, t]) => now - t < 180000).map(([n]) => n); }
};

/* 分享链接 */
function encodeState(){
  const snap = { ...sync.snapshot(), room:'' };
  const json = JSON.stringify(snap);
  return btoa(unescape(encodeURIComponent(json))).replace(/=+$/, '');
}
function decodeState(str){
  const padded = str + '='.repeat((4 - (str.length % 4)) % 4);   // 补回被去掉的 base64 padding
  return JSON.parse(decodeURIComponent(escape(atob(padded))));
}
async function makeShareLink(){
  const url = location.origin + location.pathname + '#r=' + encodeState();
  try{ await navigator.clipboard.writeText(url); toast(url.length > 8000 ? '链接较长，已复制（建议用云端房间发送）' : '分享链接已复制 ✅'); }
  catch{ toast('链接已生成，请手动复制'); }
  openSheet('form', `

    <div class="sheet-head"><h3>🔗 分享链接</h3><p>任何设备打开即导入，永久有效</p><button class="x" data-act="close">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>复制发给同学</label><textarea readonly style="min-height:110px;font-size:12px">${esc(url)}</textarea></div>
      <p class="hintline">链接较长是因为把组队 / 打卡 / 攻略都打包进去了。</p>
      <div class="btnrow"><button class="btn pri" data-act="copylink" data-link="${esc(url)}">🔗 复制链接</button></div>

}

document.addEventListener('click', async e => {
  const t = e.target;

  // 底部 tab / 发布（＋ 按钮优先判断，否则会被 .tb 规则吃掉）
  if(t.closest('#plusBtn')){ buzz(); return openPublish(null); }

  if(tb){ if(tb.dataset.page){ buzz(); go(tb.dataset.page); } return; }

  // 分类
  const catEl = t.closest('.cat');
  if(catEl){ cat = catEl.dataset.cat; renderCats(); renderFeed(); return; }

  // chip 组
  const chip = t.closest('.chip');
  if(chip){
    const box = chip.parentElement;
    if(box.id === 'fTypes'){ const v = chip.dataset.type; prefs.types = prefs.types.includes(v) ? prefs.types.filter(x => x !== v) : prefs.types.concat(v); chip.classList.toggle('on'); }
    else if(box.id === 'fExtra'){ const v = chip.dataset.extra; prefs.extras = prefs.extras.includes(v) ? prefs.extras.filter(x => x !== v) : prefs.extras.concat(v); chip.classList.toggle('on'); }
    else if(box.id === 'fHours'){ prefs.hours = +chip.dataset.hours; $$('#fHours .chip').forEach(c => c.classList.toggle('on', c === chip)); }
    else if(box.id === 'cMood'){ currentMood = chip.dataset.mood; $$('#cMood .chip').forEach(c => c.classList.toggle('on', c === chip)); }
    else if(box.id === 'nIndoor'){ $$('#nIndoor .chip').forEach(c => c.classList.toggle('on', c === chip)); }
    else if(box.classList.contains('seg')){ $$('#' + box.id + ' button').forEach(b => b.classList.toggle('on', b === chip)); }
    persistPrefs(); renderFeed(); return;
  }

  const btn = t.closest('[data-act]');
  const act = btn?.dataset.act;

  switch(act){
    case 'close': return openSheet(null);
    case 'detail': return openDetail(btn.dataset.id);
    case 'like': {
      const id = btn.dataset.id;
      const on = likeActivity(id, true);

      const g = store.guides.find(x => x.id === btn.dataset.id); if(!g) return;

      if(i >= 0) g.likedBy.splice(i, 1); else { g.likedBy.push(myNick()); buzz(14); }
      g.ts = Date.now();                       // 更新 ts，合并时本机版本才会胜出
      persistStore(); sync.schedule(); renderGuides(); return;

      const v = ($('#sNick')?.value || '').trim(); if(v){ me.nick = v; persistMe(); }
      if(!me.nick) return toast('先填个昵称');
      await sync.join($('#roomInput')?.value || '');
      if(me.room) toast('已加入房间 ' + me.room);
      openSync(); return;
    }
    case 'makelink': return makeShareLink();
    case 'copylink': try{ await navigator.clipboard.writeText(btn.dataset.link); toast('已复制 ✅'); }catch{ toast('请手动复制'); } return;
    case 'importsheet': return openImport();
  }

  // 顶栏按钮
  if(t.closest('#themeBtn')){
    const cur = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = cur; save(LS.theme, cur);
    $('#themeBtn').textContent = cur === 'dark' ? '☀️' : '🌙';
    return;
  }
  if(t.closest('#syncBtn')) return openSync();
  if(t.closest('#filterBtn')) return openFilter();
  if(t.closest('#shuffleBtn')){ gradSeed = Math.floor(Math.random() * 97); renderFeed(); return toast('换一批 🎲'); }
  if(t.closest('#meSyncBtn')) return openSync();
  if(t.closest('#shareLinkBtn')) return makeShareLink();
  if(t.closest('#exportBtn')) return exportJSON();
  if(t.closest('#importBtn')) return openImport();
  if(t.closest('#clearBtn')){
    if(confirm('确定清空本机全部组队 / 打卡 / 攻略数据？此操作不可撤销。\n注意：如果已加入云端房间，同伴的数据会在下次同步时重新合并回来。')){
      store = { teams:[], checkins:[], guides:[], activities:[], likes:{}, tomb:[] }; persistStore();
      renderTeams(); renderCheckins(); renderGuides(); renderMe(); renderFeed(); toast('已清空');
    }
    return;
  }
  if(t.closest('#editNickBtn')) return editNick();

  // 表单提交按钮
  if(t.closest('#tCreate')){ if(createTeam($('#tTitle').value.trim())) { pickNick(); openSheet(null); go('team'); toast('组队已发布 🚀'); } return; }
  if(t.closest('#cAdd')){ if(addCheckin($('#cTitle').value.trim())) { pickNick(); openSheet(null); go('checkin'); toast('打卡成功 📍'); } return; }
  if(t.closest('#gAdd')){
    const title = $('#gTitle').value.trim(), body = $('#gBody').value.trim();
    if(!title || !body) return toast('标题和正文都写一点吧～');
    pickNick();
    store.guides.unshift({ id:uid(), title, body, author:myNick(), date:ymd(new Date()), likedBy:[],
      tags:$('#gTags').value.split(/[,，]/).map(s => s.trim()).filter(Boolean), ts:Date.now() });
    persistStore(); sync.schedule(); renderGuides(); openSheet(null); go('guide'); toast('攻略已发布 🚀');
    return;
  }
  if(t.closest('#nAdd')){
    const name = $('#nName').value.trim(); if(!name) return toast('给活动起个名字～');
    store.activities.unshift({ id:'u' + uid(), name, type:$('#nType').value, price:+$('#nPrice').value || 0,
      hours:+$('#nHours').value || 2, dist:+$('#nDist').value || 1, min:+$('#nMin').value || 1, max:+$('#nMax').value || 6,
      indoor: !!$('#nIndoor .chip.on')?.dataset.indoor && $('#nIndoor .chip.on').dataset.indoor === '1',
      tags:['自建'], desc:$('#nDesc').value.trim() || '我自己加的活动。', ts:Date.now() });
    persistStore(); sync.schedule(); renderFeed(); openSheet(null); toast('已加入活动库 ✨');
    return;
  }
  if(t.closest('#resetPrefs')){ prefs = Object.assign({}, DEFAULT_PREFS); persistPrefs(); openFilter(); renderFeed(); return toast('已恢复默认'); }
});
function pickNickLater(){ /* 昵称在表单里填写 */ }

// 输入事件
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'q'){ keyword = t.value.trim(); renderFeed(); }
  if(t.id === 'fBudget'){ prefs.budget = +t.value; $('#budgetVal').textContent = prefs.budget; persistPrefs(); renderFeed(); }
  if(t.id === 'fPeople'){ prefs.people = +t.value; $('#peopleVal').textContent = prefs.people; persistPrefs(); renderFeed(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'fCity'){ prefs.city = t.value; persistPrefs(); renderWeatherBar(); refreshWeather(); }
  if(t.id === 'fDay'){ prefs.day = +t.value; persistPrefs(); renderWeatherBar(); refreshWeather(); }
});

// 双击封面点赞（移动端 double tap 兼容）
let lastTap = 0, tapTimer = null;
document.addEventListener('pointerup', e => {
  const wrap = e.target.closest('[data-tap="detail"]');
  if(!wrap) return;
  const id = wrap.dataset.id, now = Date.now();
  if(now - lastTap < 300){
    clearTimeout(tapTimer); lastTap = 0;
    likeActivity(id); renderFeed(); return;   // 双击 = 点赞（不打开详情）
  }
  lastTap = now;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { openDetail(id); }, 240);
});

/* ---------------- 17. 导入 / 导出 ---------------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(sync.snapshot(), null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `周末探索-${ymd(new Date())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出 JSON ⬇️');
}
function openImport(){
  openSheet('form', `
    <div class="grab"></div>
    <div class="sheet-head"><h3>⬆️ 导入数据</h3><p>粘贴导出的 JSON，或直接打开别人的分享链接</p><button class="x" data-act="close">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>粘贴 JSON</label><textarea id="impText" placeholder='{"teams":[...],"guides":[...]}' style="min-height:130px;font-size:12px"></textarea></div>
      <button class="btn pri block" id="doImport">导入并合并</button>
    </div>`);
  $('#doImport')?.addEventListener('click', () => {
    try{
      const data = JSON.parse($('#impText').value);
      sync.receive({ ...data, room:me.room || data.room }, Date.now());
      renderTeams(); renderCheckins(); renderGuides(); renderMe(); renderFeed();
      openSheet(null); toast('导入成功 ✅');
    }catch{ toast('JSON 格式不对'); }
  });
}
function editNick(){
  openSheet('form', `
    <div class="grab"></div>
    <div class="sheet-head"><h3>🙂 编辑资料</h3><p>昵称会显示在组队和攻略上</p><button class="x" data-act="close">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>昵称</label><input type="text" id="nickEdit" value="${esc(me.nick)}" maxlength="12" placeholder="例如：小新" /></div>
      <div class="field"><label>头像</label><div class="chips" id="emojiPick">
        ${LOGIN_EMOJI.map(m => `<div class="chip ${m === me.emoji ? 'on' : ''}" data-emoji="${m}">${m}</div>`).join('')}
      </div></div>
      <button class="btn pri block" id="saveNick">保存</button>
    </div>`);
  $('#emojiPick').addEventListener('click', e => {
    const c = e.target.closest('[data-emoji]'); if(!c) return;
    me.emoji = c.dataset.emoji; $$('#emojiPick .chip').forEach(x => x.classList.toggle('on', x === c)); persistMe();
  });
  $('#saveNick').addEventListener('click', () => {
    const v = $('#nickEdit').value.trim();
    if(!v) return toast('昵称不能为空');
    me.nick = v; persistMe(); renderMe(); renderFeed(); openSheet(null); toast('已保存 ✅');
  });
}

/* ---------------- 18. 启动 ---------------- */
function renderCats(){
  $('#catbar').innerHTML = ['全部'].concat(TYPES).map(c =>
    `<button class="cat ${c === cat ? 'on' : ''}" data-cat="${c}">${c === '全部' ? '推荐' : (TYPE_EMOJI[c] + ' ' + c)}</button>`).join('');
}
async function refreshWeather(){
  weather = await fetchWeather(prefs.city);
  renderWeatherBar(); renderFeed();
}
(async function init(){
  document.documentElement.dataset.theme = load(LS.theme, 'light');
  $('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';

  // 分享链接导入
  const m = location.hash.match(/#r=(.+)$/);
  if(m){
    try{
      const data = decodeState(m[1]);
      sync.receive({ ...data, room:'' }, Date.now());
      history.replaceState(null, '', location.pathname);
      setTimeout(() => toast('已从分享链接导入 ✅'), 500);
    }catch{ toast('分享链接解析失败'); }
  }

  renderCats(); renderTeams(); renderCheckins(); renderGuides(); renderMe();
  persistPrefs();
  renderFeed();                      // 先渲染骨架屏，天气回来后自动替换
  if(me.nick) $('#meName').textContent = me.nick;
  await refreshWeather();
  if(me.room){ sync.join(me.room); }   // 自动重连上次的房间
  // 心跳保持在线状态
  setInterval(() => { if(me.room) sync.publish(); }, 90000);
  window.addEventListener('resize', debounce(renderFeed, 220));
})();
</script>
