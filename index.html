<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>周末探索 · 周末城市探索指南</title>
<meta name="description" content="按偏好、天气、预算推荐本地周末活动，支持组队出发、打卡记录、攻略分享，多设备实时同步。" />
<meta name="theme-color" content="#FF2B4E" />
<style>
  /* =========================================================
     配色与尺寸取自小红书真实站点（xiaohongshu.txt）：
     品牌红 #ff2442 · 正文 #333 · 次要 #999 · 分隔 #eee
     布局：1440 视口下 5 列，卡片宽 215.2px，列间距 32px
     ========================================================= */
  :root{
    --red:#ff2442;
    --red-soft:#fff0f3;
    --text:#333333;
    --text-2:#666666;
    --muted:#999999;
    --muted-2:#bbbbbb;
    --bg:#ffffff;
    --hover:#f7f7f7;
    --fill:#f5f5f5;
    --line:#eeeeee;
    --amber:#e4831b; --amber-soft:#fff6e8;
    --olive:#5f8f49; --olive-soft:#f0f7ec;
    --shadow:0 4px 16px rgba(0,0,0,.08);
    --shadow-lg:0 -6px 24px rgba(0,0,0,.1);
    --r:8px;
    --rail:200px;
    --gap:32px;
  }
  html[data-theme=dark]{
    --red:#ff4d6a; --red-soft:rgba(255,77,106,.14);
    --text:#f2f2f2; --text-2:#c8c8c8; --muted:#9a9a9a; --muted-2:#777777;
    --bg:#141414; --hover:#212121; --fill:#1f1f1f; --line:#2a2a2a;
    --amber:#ffae4d; --amber-soft:rgba(255,174,77,.14);
    --olive:#9cc47a; --olive-soft:rgba(156,196,122,.14);
    --shadow:0 4px 16px rgba(0,0,0,.5);
    --shadow-lg:0 -6px 24px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{margin:0;padding:0;-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:0;background:var(--bg);color:var(--text);min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:contain;
    font-size:14px;line-height:1.4;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{border:none;background:none;cursor:pointer;padding:0}
  input,textarea,select{outline:none}
  ::placeholder{color:var(--muted-2)}
  a{color:inherit;text-decoration:none}
  [hidden]{display:none !important}
  .wrap{max-width:1180px;margin:0 auto}
  /* 统一图标：全部用 24 网格的 SVG，不用 emoji */
  .ri{display:block;fill:currentColor;flex:0 0 auto}

  /* ================= 桌面左侧导航（对齐小红书 side-bar） ================= */
  .rail{
    display:none;position:fixed;left:0;top:0;bottom:0;width:var(--rail);z-index:50;
    flex-direction:column;padding:14px 12px 18px;background:var(--bg);border-right:1px solid var(--line);
    overflow-y:auto
  }
  .rail-logo{display:flex;align-items:center;gap:8px;padding:8px 10px 22px;flex:0 0 auto}
  .rail-logo i{
    width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-style:normal;
    background:var(--red);color:#fff;font-size:12px;font-weight:800;letter-spacing:.5px;flex:0 0 auto
  }
  .rail-logo b{font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .rail-item{
    display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:8px;border-radius:10px;
    font-size:15px;font-weight:500;color:var(--text);transition:background .15s;text-align:left
  }
  .rail-item .ri{color:var(--text-2);transition:color .15s}
  .rail-item:hover{background:var(--hover)}
  .rail-item.on{font-weight:600;background:var(--hover)}
  .rail-item.on .ri{color:var(--red)}
  .rail-sep{height:1px;background:var(--line);margin:10px 12px 16px}
  .rail-foot{margin-top:auto;padding:14px 12px 0;font-size:11px;color:var(--muted-2);line-height:1.8}
  .shell{min-height:100vh}
  @media(min-width:1024px){ .shell{margin-left:var(--rail)} .rail{display:flex} }

  /* ================= 顶栏（对齐小红书搜索区） ================= */
  /* 分类条必须与搜索栏同处一个 sticky 容器：sticky 元素被限制在父容器范围内 */
  .topbar{
    position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:saturate(1.8) blur(20px)
  }
  .topbar-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:14px 16px}
  .mlogo{display:flex;align-items:center;gap:6px;flex:0 0 auto;font-weight:800;font-size:15px}
  .mlogo i{
    width:26px;height:26px;border-radius:7px;background:var(--red);color:#fff;display:grid;place-items:center;
    font-style:normal;font-size:11px;font-weight:800
  }
  .searchbox{
    flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;
    background:var(--fill);border:1px solid transparent;border-radius:999px;transition:.18s
  }
  @media(min-width:1024px){ .searchbox{max-width:640px;margin:0 auto} }
  .searchbox:focus-within{background:var(--bg);border-color:var(--red)}
  .searchbox input{flex:1;border:none;background:none;font-size:14px;min-width:0}
  .searchbox .ri{color:var(--muted)}
  .search-add{
    width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;color:var(--text-2);
    transition:.15s;flex:0 0 auto
  }
  .search-add:hover{background:var(--red);color:#fff}
  .ask-btn{
    display:none;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:999px;font-size:12.5px;
    font-weight:600;color:var(--red);background:var(--red-soft);white-space:nowrap;flex:0 0 auto
  }
  @media(min-width:1024px){ .mlogo{display:none} .ask-btn{display:inline-flex} }
  .top-actions{display:flex;gap:8px;flex:0 0 auto}
  .icon-btn{
    width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--text-2);
    background:var(--fill);transition:.15s;flex:0 0 auto
  }
  .icon-btn:hover{background:var(--hover);color:var(--text)}
  .icon-btn:active{transform:scale(.93)}

  /* ================= 分类条（对齐小红书 channel） ================= */
  .catbar{position:static;border-bottom:1px solid var(--line)}
  .catbar-in{
    max-width:1180px;margin:0 auto;display:flex;justify-content:center;gap:32px;overflow-x:auto;
    padding:0 16px;scrollbar-width:none
  }
  .catbar-in::-webkit-scrollbar{display:none}
  .cat{
    position:relative;padding:12px 0 13px;font-size:15px;color:var(--text-2);white-space:nowrap;
    font-weight:500;transition:color .18s
  }
  .cat:hover{color:var(--text)}
  .cat.on{color:var(--text);font-weight:700}
  .cat.on::after{
    content:"";position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:20px;height:3px;
    border-radius:2px;background:var(--red)
  }
  @media(max-width:1023px){ .catbar-in{justify-content:flex-start;gap:24px} }

  /* ================= 天气条 ================= */
  .weatherbar{
    display:flex;align-items:center;gap:8px;margin:12px 8px 0;padding:10px 14px;border-radius:10px;
    background:var(--fill);font-size:13px;color:var(--text-2);line-height:1.5
  }
  .weatherbar b{color:var(--text);font-weight:600}
  .weatherbar .wtag{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
  @media(min-width:600px){ .weatherbar{margin-left:16px;margin-right:16px} }

  /* ================= 工具行 ================= */
  .toolrow{display:flex;align-items:center;gap:10px;padding:12px 8px 4px;flex-wrap:wrap}
  @media(min-width:600px){ .toolrow{padding-left:16px;padding-right:16px} }
  .toolrow .count{font-size:13px;color:var(--muted);margin-right:auto}
  .pill{
    display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 14px;border-radius:999px;font-size:13px;
    font-weight:500;color:var(--text-2);background:var(--fill);transition:.15s;white-space:nowrap
  }
  .pill:hover{background:var(--hover);color:var(--text)}
  .pill:active{transform:scale(.96)}
  .pill.on{background:var(--red-soft);color:var(--red)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}

  /* ================= 瀑布流（卡片结构对齐小红书 note-item） ================= */
  .masonry{display:flex;align-items:flex-start;gap:8px;padding:12px 8px 110px}
  @media(min-width:600px){ .masonry{gap:16px;padding-left:16px;padding-right:16px} }
  @media(min-width:1024px){ .masonry{gap:24px;padding-bottom:48px} }
  @media(min-width:1320px){ .masonry{gap:32px} }
  .mcol{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  @media(min-width:600px){ .mcol{gap:16px} }
  @media(min-width:1024px){ .mcol{gap:24px} }
  @media(min-width:1320px){ .mcol{gap:32px} }

  /* 卡片默认可见，入场动画只做增强（动画没跑也绝不能是空白） */
  .note{position:relative;opacity:1}
  .note.anim{animation:fadeUp .5s cubic-bezier(.2,.8,.3,1) both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){
    .note.anim,.row-card.anim{animation:none}
    *{transition-duration:.01ms !important}
  }
  .cover{
    position:relative;display:block;width:100%;border-radius:var(--r);overflow:hidden;cursor:pointer;
    transition:filter .2s,transform .2s;background:var(--fill)
  }
  .note:hover .cover{filter:brightness(.96)}
  .note:active .cover{transform:scale(.99)}
  .cover .emo{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:46px;z-index:2;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,.12))
  }
  @media(max-width:599px){ .cover .emo{font-size:38px} }
  .cover .grain{
    position:absolute;inset:0;opacity:.5;
    background-image:radial-gradient(circle at 25% 30%,rgba(255,255,255,.55) 0 2px,transparent 3px),
                     radial-gradient(circle at 75% 70%,rgba(255,255,255,.4) 0 2px,transparent 3px);
    background-size:34px 34px,52px 52px
  }
  .cover .rings{position:absolute;inset:-30% -10% auto auto;width:150px;height:150px;border-radius:50%;
    border:14px solid rgba(255,255,255,.28)}
  /* 角标风格对齐小红书视频卡片的时长标签 */
  .cover .badge{
    position:absolute;z-index:3;height:20px;padding:0 6px;border-radius:4px;font-size:12px;line-height:20px;
    background:rgba(0,0,0,.5);color:#fff;font-weight:400
  }
  .cover .badge.bl{left:8px;bottom:8px}
  .cover .badge.tr{right:8px;top:8px;background:rgba(255,255,255,.92);color:var(--red);font-weight:600}
  .cover .badge.free{background:rgba(95,143,73,.9)}
  /* 底部信息区（对齐小红书 .footer） */
  .footer{padding:10px 2px 0}
  .title{
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    font-size:14px;line-height:20px;color:var(--text);font-weight:500;word-break:break-word;margin-bottom:8px
  }
  .author-wrapper{display:flex;align-items:center;gap:6px;min-width:0}
  .author{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
  .avatar-container{width:20px;height:20px;border-radius:50%;overflow:hidden;flex:0 0 auto;background:var(--fill);
    display:grid;place-items:center;font-size:11px}
  .name{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .like-wrapper{display:flex;align-items:center;gap:3px;flex:0 0 auto;color:var(--muted);cursor:pointer;padding:2px 0}
  .like-wrapper .ri{color:var(--muted-2)}
  .like-wrapper.on{color:var(--red)}
  .like-wrapper.on .ri{color:var(--red);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  .like-wrapper .count{font-size:12px;font-weight:400}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.45)}100%{transform:scale(1)}}

  /* 双击点赞的爱心 */
  .burst{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.3);font-size:110px;z-index:200;
    pointer-events:none;opacity:0
  }
  .burst.go{animation:burst .8s ease-out}
  @keyframes burst{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}
    70%{opacity:1;transform:translate(-50%,-90%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-130%) scale(.9)}
  }

  /* 骨架屏 */
  .sk .a{height:180px;border-radius:var(--r);background:var(--fill);animation:sh 1.2s infinite}
  .sk .b{height:14px;margin:10px 2px 0;border-radius:4px;background:var(--fill);animation:sh 1.2s infinite .1s}
  .sk .c{height:14px;margin:8px 2px 0;width:60%;border-radius:4px;background:var(--fill);animation:sh 1.2s infinite .2s}
  .sk .d{height:20px;margin:14px 2px 0;width:50%;border-radius:10px;background:var(--fill);animation:sh 1.2s infinite .3s}
  @keyframes sh{0%,100%{opacity:.6}50%{opacity:1}}

  /* ================= 列表页通用 ================= */
  .page{padding:16px 12px 100px}
  @media(min-width:600px){ .page{padding-left:16px;padding-right:16px} }
  @media(min-width:1024px){ .page{padding-bottom:48px} }
  .sec-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;margin:8px 2px 12px}
  .sec-title small{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
  .list{display:grid;gap:12px}
  .row-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px}
  .row-card.anim{animation:fadeUp .45s cubic-bezier(.2,.8,.3,1) both}
  .row-card:hover{border-color:var(--muted-2)}
  .row-card .rt{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  .row-card h3{margin:0;font-size:15px;line-height:1.4;font-weight:600}
  .row-card .meta{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.7}
  .ring{
    flex:0 0 auto;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative;
    background:conic-gradient(var(--red) calc(var(--p)*1%),var(--fill) 0)
  }
  .ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
  .ring span{position:relative;z-index:1;font-size:11.5px;font-weight:600}
  .ring.mine{background:conic-gradient(var(--amber) calc(var(--p)*1%),var(--fill) 0)}
  .bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;margin-top:10px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--red)}
  .faces{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .faces span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--text-2)}
  .faces span.me{background:var(--red-soft);color:var(--red);font-weight:500}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:5px;height:34px;padding:0 16px;border-radius:999px;
    font-size:13px;font-weight:500;background:var(--fill);color:var(--text);transition:.15s
  }
  .btn:hover{background:var(--hover)}
  .btn:active{transform:scale(.97)}
  .btn.pri{background:var(--red);color:#fff}
  .btn.pri:hover{background:#e61e3c}
  .btn.line{background:transparent;border:1px solid var(--line)}
  .btn.line:hover{background:var(--fill)}
  .btn.warn{background:transparent;border:1px solid var(--line);color:var(--red)}
  .btn.block{width:100%;height:42px;font-size:14px;border-radius:999px}
  .btn[disabled]{opacity:.45}
  .empty{text-align:center;color:var(--muted);font-size:13px;line-height:1.9;padding:48px 16px}
  .empty .big{display:block;margin:0 auto 12px;width:48px;height:48px;color:var(--muted-2)}

  /* 时间线 */
  .tl{position:relative;padding-left:16px;border-left:1px solid var(--line);margin-left:4px}
  .tl::before{content:"";position:absolute;left:-4px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--red)}
  .tl + .tl{margin-top:16px}
  .tl h4{margin:0;font-size:14.5px;font-weight:600}
  .tl .meta{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.7}
  .tl .quote{font-size:13px;margin-top:8px;padding:9px 12px;border-radius:8px;background:var(--fill);color:var(--text-2);line-height:1.6}

  /* 统计 */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 6px;text-align:center}
  .stat b{display:block;font-size:18px;line-height:1.2;font-weight:600}
  .stat span{font-size:11.5px;color:var(--muted)}
  @media(max-width:360px){ .stat b{font-size:16px} }

  .field{margin-bottom:16px}
  .field>label{display:block;font-size:13px;color:var(--text-2);font-weight:500;margin-bottom:8px}
  select,input[type=text],input[type=number],input[type=date],textarea{
    width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);
    font-size:14px;transition:.15s
  }
  select:focus,input:focus,textarea:focus{border-color:var(--red)}
  textarea{resize:vertical;min-height:88px;line-height:1.6}
  input[type=range]{width:100%;accent-color:var(--red);height:22px}
  .two-col{display:flex;gap:10px}
  .two-col>*{flex:1;min-width:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{
    padding:7px 14px;border-radius:999px;font-size:13px;background:var(--fill);color:var(--text-2);
    transition:.15s;user-select:none;font-weight:500;cursor:pointer
  }
  .chip:hover{background:var(--hover);color:var(--text)}
  .chip.on{background:var(--red-soft);color:var(--red);font-weight:600}
  .hintline{font-size:12px;color:var(--muted);line-height:1.8}

  /* ================= 底部 Tab（移动端） ================= */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:60;background:color-mix(in srgb,var(--bg) 94%,transparent);
    backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)
  }
  @media(min-width:1024px){ .tabbar{display:none} }
  .tabbar-in{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:54px}
  .tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:100%;color:var(--muted)}
  .tb .ri{color:var(--muted)}
  .tb span{font-size:10.5px;font-weight:500}
  .tb.on{color:var(--text)}
  .tb.on .ri{color:var(--text)}
  .tb.plus{position:relative}
  .tb.plus .pl{
    position:absolute;top:-10px;width:46px;height:32px;border-radius:8px;display:grid;place-items:center;
    background:var(--red);color:#fff;transition:.16s
  }
  .tb.plus .pl .ri{color:#fff}
  .tb.plus:active .pl{transform:scale(.94)}

  /* ================= 弹层 ================= */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:70;opacity:0;transition:.25s;pointer-events:none}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:80;max-width:640px;margin:0 auto;background:var(--bg);
    border-radius:16px 16px 0 0;box-shadow:var(--shadow-lg);transform:translateY(102%);
    transition:transform .3s cubic-bezier(.3,1,.4,1);max-height:88vh;display:flex;flex-direction:column
  }
  .sheet.on{transform:none}
  .sheet-head{position:relative;padding:18px 20px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
  .sheet-head h3{margin:0;font-size:16px;font-weight:600}
  .sheet-head p{margin:6px 0 0;font-size:12px;color:var(--muted);line-height:1.7}
  .sheet-head .x{
    position:absolute;right:16px;top:16px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
    color:var(--muted);background:var(--fill)
  }
  .sheet-body{padding:16px 20px calc(26px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
  .grab{width:36px;height:4px;border-radius:99px;background:var(--line);margin:8px auto 0}

  /* 详情页 */
  .dcover{position:relative;height:190px;border-radius:12px;overflow:hidden;display:grid;place-items:center;margin-bottom:14px}
  .dcover .emo{font-size:68px;z-index:2;filter:drop-shadow(0 6px 14px rgba(0,0,0,.16))}
  .dtitle{font-size:18px;font-weight:600;line-height:1.45;margin:0 0 10px}
  .dmeta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .dmeta span{font-size:12px;color:var(--text-2);background:var(--fill);padding:5px 11px;border-radius:999px}
  .dsec{margin-top:18px}
  .dsec h4{margin:0 0 10px;font-size:14px;font-weight:600}
  .why{display:flex;flex-wrap:wrap;gap:6px}
  .why b{font-size:12px;font-weight:500;padding:5px 10px;border-radius:6px;background:var(--olive-soft);color:var(--olive)}
  .why b.w{background:var(--amber-soft);color:var(--amber)}
  .dbody{font-size:14px;line-height:1.75;color:var(--text-2);white-space:pre-wrap}
  .planbox{background:var(--fill);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.8;color:var(--text-2)}
  .planbox b{color:var(--text)}
  .actionbar{
    display:flex;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-top:14px;margin-top:16px;
    border-top:1px solid var(--line)
  }
  .actionbar .btn{flex:1}

  /* 发布选择 */
  .pubgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .pubgrid button{background:var(--fill);border-radius:12px;padding:16px 6px;text-align:center;transition:.15s}
  .pubgrid button:hover{background:var(--hover)}
  .pubgrid button:active{transform:scale(.96)}
  .pubgrid .ri{margin:0 auto 8px;color:var(--text-2)}
  .pubgrid b{font-size:12.5px;font-weight:500}

  /* 同步状态 */
  .syncbox{background:var(--fill);border-radius:10px;padding:14px;margin-bottom:14px}
  .syncrow{display:flex;align-items:center;gap:9px;font-size:13px}
  .syncrow .led{width:8px;height:8px;border-radius:50%;background:var(--muted-2);flex:0 0 auto}
  .syncrow .led.on{background:#3aa757}
  .syncrow .led.wait{background:var(--amber)}
  .roomcode{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:26px;font-weight:700;letter-spacing:5px;
    text-align:center;padding:12px;border-radius:10px;background:var(--bg);color:var(--red);margin:12px 0
  }
  .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:5px 0}
  .kv b{color:var(--text);font-weight:500}

  /* toast */
  #toast{
    position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.92);opacity:0;pointer-events:none;z-index:300;
    background:rgba(0,0,0,.8);color:#fff;padding:12px 22px;border-radius:8px;font-size:13.5px;font-weight:400;
    max-width:80vw;text-align:center;line-height:1.5;transition:.2s
  }
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  .foot{text-align:center;color:var(--muted-2);font-size:11.5px;line-height:2;padding:8px 12px 100px}
  .foot a{color:var(--muted)}

</style>

<script>
/* =========================================================
   周末探索 v2 —— 小红书式交互 + 跨设备同步
   模块：[工具] [数据] [天气/推荐引擎] [封面] [信息流] [弹层]
        [组队] [打卡] [攻略] [我的] [云同步]
   ========================================================= */

/* ---------------- 0. 工具 ---------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function weekendOffset(which){ const dow = new Date().getDay(); return ((which===1?6:0) - dow + 7) % 7; }

const MOCK_W = [[2,22,14,10],[0,25,16,0],[61,19,13,75],[1,24,15,5],[80,21,15,60],[3,20,14,30],[0,26,17,0]];
function mockWeather(){
  const t = new Date();
  return { live:false, days: MOCK_W.map((m,i)=>{
    const d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i), w = WMO[m[0]] || WMO[2];
    return { date:ymd(d), code:m[0], label:w[0], emoji:w[1], ok:w[2], tmax:m[1], tmin:m[2], pop:m[3] };
  })};
}
async function fetchWeather(city){
  const c = CITIES[city]; if(!c) return mockWeather();
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}`
    + `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 6000);
  try{
    const res = await fetch(url, { signal: ctrl.signal }); if(!res.ok) throw new Error('http ' + res.status);
    const d = (await res.json()).daily;
    return { live:true, days: d.time.map((t,i)=>{
      const code = d.weather_code[i], w = WMO[code] || WMO[2];
      return { date:t, code, label:w[0], emoji:w[1], ok:w[2], tmax:Math.round(d.temperature_2m_max[i]),
               tmin:Math.round(d.temperature_2m_min[i]), pop: d.precipitation_probability_max?.[i] ?? 0 };
    })};
  }catch{ return mockWeather(); } finally{ clearTimeout(timer); }
}

/* ---------------- 3. 推荐引擎（可解释加权评分） ---------------- */
function scoreActivity(a, w){
  let s = 30; const reasons = [], warns = [];
  const rainy = isWet(w);
  if(prefs.types.length){
    if(prefs.types.includes(a.type)){ s += 26; reasons.push(`命中偏好 · ${a.type}`); } else { s -= 18; }
  }
  if(a.indoor){
    if(rainy){ s += 18; reasons.push('下雨天室内更稳'); }
  } else if(rainy){
    s -= 32; warns.push(w ? `${w.label} ${w.pop}% 降水，户外有风险` : '天气可能不佳');
  } else {
    s += 16;
    if(w && w.tmax >= 18 && w.tmax <= 28){ s += 6; reasons.push(`天气刚好 · ${w.tmax}°C`); } else { reasons.push('天气适合户外'); }
  }
  if(a.price <= prefs.budget){
    s += 18 - Math.min(10, Math.round(a.price / Math.max(1, prefs.budget) * 10));
    reasons.push(a.price === 0 ? '完全免费' : `¥${a.price} 在预算内`);
  } else {
    const over = a.price - prefs.budget;
    s -= Math.min(30, 12 + over / 5); warns.push(`超预算 ¥${over}`);
  }
  if(prefs.people >= a.min && prefs.people <= a.max){ s += 15; reasons.push(`${prefs.people} 人正合适`); }
  else if(prefs.people < a.min){ s -= 12; warns.push(`至少 ${a.min} 人`); }
  else { s -= 8; warns.push(`更适合 ${a.max} 人以内`); }
  const lim = prefs.hours === 9 ? 12 : prefs.hours;
  if(a.hours <= lim){ s += 12; if(lim - a.hours >= 0.5) reasons.push(`约 ${a.hours}h，来得及`); }
  else { s -= 16; warns.push(`约需 ${a.hours}h，时间偏紧`); }
  const near = prefs.extras.includes('near');
  if(a.dist <= 3){ s += near ? 16 : 8; reasons.push(`离家 ${a.dist}km`); }
  else if(a.dist >= 15){ s -= near ? 22 : 8; if(near) warns.push(`较远 ${a.dist}km`); }
  if(prefs.extras.includes('cheap')){ if(a.price <= 40){ s += 10; reasons.push('花费很低'); } else s -= 8; }
  if(prefs.extras.includes('photo') && a.tags.includes('出片')){ s += 10; reasons.push('很出片'); }
  if(prefs.extras.includes('newbie') && a.tags.includes('新手友好')){ s += 10; reasons.push('新手友好'); }
  return { score: Math.max(6, Math.min(99, Math.round(s))), reasons: reasons.slice(0,4), warns: warns.slice(0,2) };
}
function planTime(a){
  const start = prefs.day === 1 ? '周六' : '周日';
  let h = 14;
  if(a.type === '市集' && a.hours <= 2) h = 10;
  if(a.type === '徒步' || a.type === '露营') h = 9;
  if(a.type === '夜骑') h = 18;
  if(a.type === '演出') h = 19.5;
  const f = t => `${String(Math.floor(t)).padStart(2,'0')}:${t % 1 ? '30' : '00'}`;
  return `${start} ${f(h)}-${f(h + a.hours)}`;
}

const PATTERNS = ['grain','rings','none'];
const hash = s => { let h = 0; for(let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; };
let gradSeed = 0;

  return (pat === 'rings' ? '<div class="rings"></div>' : '') + (pat === 'grain' ? '<div class="grain"></div>' : '');
};
function coverHTML(a, h, extra){

}

let cat = '全部', keyword = '';
function visibleActivities(){
  const w = targetWeather();
  return activityLib().map(a => ({ a, ...scoreActivity(a, w) }))
    .filter(x => (cat === '全部' || x.a.type === cat))
    .filter(x => {
      if(!keyword) return true;
      const k = keyword.toLowerCase();
      return (x.a.name + x.a.desc + x.a.type + x.a.tags.join(' ')).toLowerCase().includes(k);
    })
    .sort((x, y) => y.score - x.score);
}

function observeIn(){
  // 纯增强：默认已可见，IO 只负责在元素进入视口时补一个入场动画。
  // 即使 IO 不回调 / 不支持，页面内容也照样完整可见。
  if(!('IntersectionObserver' in window)) return;
  const io = new IntersectionObserver((es, o) => {
    es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('anim'); o.unobserve(e.target); } });
  }, { rootMargin:'80px' });
  $$('.note:not(.anim), .row-card:not(.anim)').forEach(el => io.observe(el));
}

function toggleTheme(){

  syncThemeIcons();
}
function syncThemeIcons(){
  const dark = document.documentElement.dataset.theme === 'dark';
  const id = dark ? '#i-sun' : '#i-moon';
  ['#themeBtn', '#railTheme'].forEach(sel => {
    const u = $(sel) && $(sel).querySelector('use');
    if(u) u.setAttribute('href', id);
  });
}
// 瀑布流列数：窄屏 2 列 → 桌面最多 5 列（跟随容器宽度，缩放窗口即时生效）
function colCount(){
  const el = $('#feed');
  const w = (el ? el.clientWidth : 0) || window.innerWidth;
  return w < 520 ? 2 : w < 860 ? 3 : w < 1180 ? 4 : 5;
}

/* ---------------- 15. 云同步（textdb.dev 公共存储 + 分享链接） ---------------- */
const DB = 'https://textdb.dev/api/data';
// 房间码 → 存储 key。textdb 的语义：拿到 key 的人都能读写，正好等价于「房间码即钥匙」
const topicOf = code => 'wcg-' + String(code).toUpperCase();
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({ length:6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join('');
const POLL_MS = 6000;          // 轮询间隔：够实时，又不至于把公共服务的请求打爆

const sync = {
  poll:null, status:'off', lastPub:0, peers:{}, pubTimer:null, inflight:false,
  statusText(){
    return { off:'未开启同步', live:'🟢 已连接，自动同步', syncing:'🟡 同步中…', err:'🔴 同步失败（数据仍在本机）' }[this.status] || this.status;
  },
  async join(code){
    code = String(code || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    if(code.length < 4) return toast('房间码至少 4 位');
    me.room = code; me.joined = Date.now(); persistMe();
    this.status = 'syncing'; renderMe(); renderSyncSheet();
    await this.pull();            // 先拉：如果是已有房间，先把同伴的数据合并进来
    await this.publish(true);     // 再把本机数据并回去
    this.listen();
  },
  leave(){
    this.stopPoll();
    me.room = ''; persistMe(); this.status = 'off'; this.peers = {};
    renderMe(); renderSyncSheet(); toast('已离开房间');
  },
  listen(){
    this.stopPoll(); this.status = 'live';
    this.poll = setInterval(() => { if(!document.hidden) this.pull(); }, POLL_MS);
    renderMe(); renderSyncSheet();
  },
  stopPoll(){ if(this.poll){ clearInterval(this.poll); this.poll = null; } },
  schedule(){ if(!me.room) return; clearTimeout(this.pubTimer); this.pubTimer = setTimeout(() => this.publish(), 600); },
  async publish(force){
    if(!me.room || this.inflight) return;
    this.inflight = true;
    try{
      // 关键：先拉取云端并合并，再做「读-改-写」。
      // 否则后写的客户端会用自己较少的数据整份覆盖，抹掉别人的贡献。
      try{ const remote = await this.fetchRemote(); if(remote) this.receive(remote, true); }catch{}
      const snap = this.snapshot();
      let payload = JSON.stringify(snap);
      if(payload.length > 60000){      // 礼貌上限，超出就丢掉最旧的条目（本机数据不受影响）
        snap.checkins = snap.checkins.slice(0, 8);
        snap.guides = snap.guides.slice(0, 8);
        payload = JSON.stringify(snap);
      }
      const r = await fetch(`${DB}/${topicOf(me.room)}`, {
        method:'POST', body: payload, headers:{ 'Content-Type':'application/json' }
      });
      if(!r.ok) throw new Error('http ' + r.status);
      this.lastPub = Date.now(); this.status = 'live';
      this.peers[me.nick || '我'] = Date.now();
    }catch{ this.status = 'err'; }
    this.inflight = false;
    renderMe(); renderSyncSheet();
  },
  snapshot(){
    return { v:2, room:me.room, nick:me.nick, ts:Date.now(),
      teams:store.teams.slice(0, 20), checkins:store.checkins.slice(0, 20),
      guides:store.guides.map(g => ({ ...g, body:(g.body || '').slice(0, 500) })).slice(0, 20),
      activities:store.activities.slice(0, 12), likes:store.likes, tomb:store.tomb.slice(-150) };
  },
  async fetchRemote(){
    if(!me.room) return null;
    // 注意：这里刻意不发 Accept: application/json —— textdb 的 JSON 模式会把值再包一层
    // JSON 字符串（响应形如 "{\"a\":1}"），导致解析出字符串、合并静默失效。
    const r = await fetch(`${DB}/${topicOf(me.room)}?_=${Date.now()}`);
    if(!r.ok) throw new Error('http ' + r.status);
    const txt = (await r.text()).trim();
    if(!txt) return null;                      // 空 = 房间还没人写过
    let data = JSON.parse(txt);
    if(typeof data === 'string') data = JSON.parse(data);   // 万一被包了一层，再解一次
    return (data && typeof data === 'object') ? data : null;
  },
  async pull(){
    if(!me.room) return;
    try{
      const remote = await this.fetchRemote();
      if(remote) this.receive(remote);
      if(this.status === 'err' || this.status === 'syncing') this.status = 'live';
    }catch{ this.status = 'err'; }
    renderMe(); renderSyncSheet();
  },
  receive(remote, quiet){
    if(!remote || typeof remote !== 'object') return;
    if(remote.room && me.room && remote.room !== me.room) return;   // 房号不符才丢弃
    // 只有对方最近 90 秒内发布过，才算「在线」
    if(remote.nick && (Date.now() - (remote.ts || 0)) < 90000) this.peers[remote.nick] = Date.now();
    // 合并：按 id 并集，同 id 取 ts 较新者；墓碑（删除）优先
    const tomb = new Set([...(store.tomb || []), ...(remote.tomb || [])]);
    ['teams','checkins','guides','activities'].forEach(key => {
      const map = new Map((store[key] || []).map(x => [x.id, x]));
      (remote[key] || []).forEach(r => { const m = map.get(r.id); if(!m || (r.ts || 0) > (m.ts || 0)) map.set(r.id, r); });
      store[key] = [...map.values()].filter(x => !tomb.has(x.id));
    });
    Object.entries(remote.likes || {}).forEach(([id, obj]) => {
      const mine = { ...(store.likes[id] || {}) };
      Object.entries(obj || {}).forEach(([nick, v]) => {
        if(typeof v !== 'number') return;                       // 忽略 v1 的旧数组格式
        if(!mine[nick] || Math.abs(v) > Math.abs(mine[nick])) mine[nick] = v;
      });
      store.likes[id] = mine;
    });
    store.tomb = [...tomb].slice(-150);
    persistStore();
    renderTeams(); renderCheckins(); renderGuides(); renderMe(); if(!quiet) renderFeed();
  },
  online(){ const now = Date.now(); return Object.entries(this.peers).filter(([, t]) => now - t < 180000).map(([n]) => n); }
};

/* 分享链接 */
function encodeState(){
  const snap = { ...sync.snapshot(), room:'' };
  const json = JSON.stringify(snap);
  return btoa(unescape(encodeURIComponent(json))).replace(/=+$/, '');
}
function decodeState(str){
  const padded = str + '='.repeat((4 - (str.length % 4)) % 4);   // 补回被去掉的 base64 padding
  return JSON.parse(decodeURIComponent(escape(atob(padded))));
}
async function makeShareLink(){
  const url = location.origin + location.pathname + '#r=' + encodeState();
  try{ await navigator.clipboard.writeText(url); toast(url.length > 8000 ? '链接较长，已复制（建议用云端房间发送）' : '分享链接已复制'); }

    store.activities.unshift({ id:'u' + uid(), name, type:$('#nType').value, price:+$('#nPrice').value || 0,

    persistStore(); sync.schedule(); renderFeed(); openSheet(null); toast('已加入活动库');
    return;
  }
  if(t.closest('#resetPrefs')){ prefs = Object.assign({}, DEFAULT_PREFS); persistPrefs(); openFilter(); renderFeed(); return toast('已恢复默认'); }
});

  const wrap = e.target.closest('[data-tap="detail"]');
  if(!wrap) return;
  const id = wrap.dataset.id, now = Date.now();
  if(now - lastTap < 300){
    clearTimeout(tapTimer); lastTap = 0;
    likeActivity(id); renderFeed(); return;   // 双击 = 点赞（不打开详情）
  }
  lastTap = now;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { openDetail(id); }, 240);
});

/* ---------------- 17. 导入 / 导出 ---------------- */
function exportJSON(){
  const blob = new Blob([JSON.stringify(sync.snapshot(), null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `周末探索-${ymd(new Date())}.json`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出 JSON');
}
function openImport(){
  openSheet('form', `
    <div class="grab"></div>
    <div class="sheet-head"><h3>导入数据</h3><p>粘贴导出的 JSON，或直接打开别人的分享链接</p><button class="x" data-act="close"><svg class="ri" width="16" height="16"><use href="#i-close"></use></svg></button></div>
    <div class="sheet-body">
      <div class="field"><label>粘贴 JSON</label><textarea id="impText" placeholder='{"teams":[...],"guides":[...]}' style="min-height:130px;font-size:12px"></textarea></div>
      <button class="btn pri block" id="doImport">导入并合并</button>
    </div>`);
  $('#doImport')?.addEventListener('click', () => {
    try{
      const data = JSON.parse($('#impText').value);
      sync.receive({ ...data, room:me.room || data.room }, Date.now());
      renderTeams(); renderCheckins(); renderGuides(); renderMe(); renderFeed();
      openSheet(null); toast('导入成功');
    }catch{ toast('JSON 格式不对'); }
  });
}
function editNick(){
  openSheet('form', `
    <div class="grab"></div>
    <div class="sheet-head"><h3>编辑资料</h3><p>昵称会显示在组队和攻略上</p><button class="x" data-act="close"><svg class="ri" width="16" height="16"><use href="#i-close"></use></svg></button></div>
    <div class="sheet-body">
      <div class="field"><label>昵称</label><input type="text" id="nickEdit" value="${esc(me.nick)}" maxlength="12" placeholder="例如：小新" /></div>
      <div class="field"><label>头像</label><div class="chips" id="emojiPick">
        ${LOGIN_EMOJI.map(m => `<div class="chip ${m === me.emoji ? 'on' : ''}" data-emoji="${m}">${m}</div>`).join('')}
      </div></div>
      <button class="btn pri block" id="saveNick">保存</button>
    </div>`);
  $('#emojiPick').addEventListener('click', e => {
    const c = e.target.closest('[data-emoji]'); if(!c) return;
    me.emoji = c.dataset.emoji; $$('#emojiPick .chip').forEach(x => x.classList.toggle('on', x === c)); persistMe();
  });
  $('#saveNick').addEventListener('click', () => {
    const v = $('#nickEdit').value.trim();
    if(!v) return toast('昵称不能为空');
    me.nick = v; persistMe(); renderMe(); renderFeed(); openSheet(null); toast('已保存');
  });
}

/* ---------------- 18. 启动 ---------------- */
function renderCats(){
  // 分类纯文字不带图标 —— 与小红书的顶部 Tab 一致，减少视觉噪音
  $('#catbar').innerHTML = ['全部'].concat(TYPES).map(c =>
    `<button class="cat ${c === cat ? 'on' : ''}" data-cat="${c}">${c === '全部' ? '推荐' : c}</button>`).join('');
}
async function refreshWeather(){
  weather = await fetchWeather(prefs.city);
  renderWeatherBar(); renderFeed();
}
(async function init(){
  document.documentElement.dataset.theme = load(LS.theme, 'light');
  syncThemeIcons();

  // 分享链接导入
  const m = location.hash.match(/#r=(.+)$/);
  if(m){
    try{
      const data = decodeState(m[1]);
      sync.receive({ ...data, room:'' }, Date.now());
      history.replaceState(null, '', location.pathname);
      setTimeout(() => toast('已从分享链接导入'), 500);
    }catch{ toast('分享链接解析失败'); }
  }

  renderCats(); renderTeams(); renderCheckins(); renderGuides(); renderMe();
  persistPrefs();
  renderFeed();                      // 先渲染骨架屏，天气回来后自动替换
  if(me.nick) $('#meName').textContent = me.nick;
  await refreshWeather();
  if(me.room){ sync.join(me.room); }   // 自动重连上次的房间
  // 心跳保持在线状态
  setInterval(() => { if(me.room) sync.publish(); }, 90000);
  window.addEventListener('resize', debounce(renderFeed, 220));
})();
</script>
